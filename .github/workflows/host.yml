name: Host platform checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    name: Host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Set Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - name: Select Rust toolchain
        run: rustup default 1.99.1
      - name: Install locked Node dependencies
        run: npm ci
      - name: Check generated contracts, Node SDK and runtime
        run: npm test
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build standalone Host
        run: cargo build -p vibeone-host --locked
      - name: Isolated Host transport, ACP, approvals and restart
        run: node --test tests/ci-host.test.mjs
