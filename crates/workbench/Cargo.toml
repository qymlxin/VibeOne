[package]
name = "vibeone-workbench"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
vibeone-agent-client = { path = "../agent-client" }
vibeone-storage = { path = "../storage" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal", "fs"] }
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
