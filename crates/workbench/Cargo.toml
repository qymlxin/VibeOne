[package]
name = "vibeone-workbench"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "=0.22.1"
vibeone-agent-client = { path = "../agent-client" }
vibeone-storage = { path = "../storage" }
serde.workspace = true
serde_json.workspace = true
schemars = { version = "=0.8.22", features = ["derive"] }
tokio = { workspace = true, features = ["net", "signal", "fs"] }
uuid.workspace = true
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors", "fs"] }
vibeone-plugin-host = { version = "0.1.0", path = "../plugin-host" }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rcgen = "0.14.10"
sha2 = "0.11.1"
jsonschema = { version = "0.60.2", default-features = false }
time = "0.3"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
cap-std = "4.0.3"

tempfile = "3"

[dev-dependencies]
tokio-tungstenite = "0.29"

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["ring", "std", "tls12"]

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["process", "fs"] }
