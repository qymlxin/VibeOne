<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="450" viewBox="0 0 1060 450" role="img" aria-labelledby="title desc">
<title id="title">文本产物保存与原始快照对账</title><desc id="desc">客户端使用稳定key和路径同步请求Host，Host查回执。已有回执从SQLite产物记录返回原ID及内容，首次采集才读取工作区并以单事务提交产物、事件和回执。此操作不启动Agent。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1060" height="450" fill="#fff" rx="12"/>
<g font-family="system-ui,sans-serif" fill="#1a1c1f"><text x="30" y="40" font-size="22" font-weight="600">保存产物：重试返回原快照，不重读当前文件</text>
<g fill="#f5f5f5" stroke="#d4d4d4"><rect x="30" y="100" width="210" height="110" rx="10"/><rect x="310" y="100" width="275" height="110" rx="10"/><rect x="670" y="70" width="360" height="90" rx="10"/><rect x="670" y="250" width="360" height="115" rx="10"/></g>
<g font-size="17" font-weight="600"><text x="50" y="133">桌面 / 手机文件页</text><text x="330" y="133">Host：权限 → 目录串行门</text><text x="690" y="103">命中：读取已保存的产物记录</text><text x="690" y="283">首次：读取工作区文本文件</text></g>
<g font-size="15"><text x="50" y="164">path + 稳定 key</text><text x="50" y="192">失败保留原目标，手动重试</text><text x="330" y="164">先查回执与参数指纹</text><text x="330" y="192">同键不同路径：409</text><text x="690" y="132">原ID / 正文 / 时间 / Run关联</text><text x="690" y="312">范围 / 类型 / 配额检查，正文有界</text><text x="690" y="341">SQLite单事务：产物 + 事件 + 回执</text></g>
<g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"><path d="M240 155H310"/><path d="M585 130H625V115H670"/><path d="M585 180H625V305H670"/><path d="M850 365V395H135V210"/></g>
<g font-size="13" fill="#525252"><text x="246" y="139">HTTP</text><text x="601" y="101">已有</text><text x="595" y="277">首次</text><text x="280" y="420">同步返回保存结果；不启动Agent。源文件变化或删除后，重试仍返回原记录。</text></g></g></svg>
