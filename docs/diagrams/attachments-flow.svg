<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440"><rect width="1080" height="440" rx="12" fill="#fafafa"/><g font-family="system-ui,sans-serif" font-size="14" fill="#222"><text x="25" y="35" font-size="19" font-weight="600">附件：先持久保存，再按 Agent 能力发送真实内容</text><g stroke="#aaa" fill="#fff"><rect x="25" y="80" width="210" height="75" rx="8"/><rect x="305" y="80" width="285" height="75" rx="8"/><rect x="660" y="80" width="390" height="75" rx="8"/><rect x="25" y="220" width="210" height="80" rx="8"/><rect x="305" y="220" width="285" height="80" rx="8"/><rect x="660" y="220" width="390" height="80" rx="8"/></g><text x="42" y="109">客户端选取 / 粘贴 / 拖入</text><text x="42" y="135">POST 会话附件 · HTTPS</text><text x="322" y="109">Host：角色、会话、类型、大小校验</text><text x="322" y="135">返回服务端 ID 与元数据</text><text x="677" y="109">私有 SQLite：字节、哈希、名称和会话归属</text><text x="677" y="135">相同内容去重；快照只保存引用，不反复搬运图片</text><text x="42" y="249">发送消息：文字 + 附件 ID</text><text x="42" y="277">HTTP 受理 → 持久 Run / 队列</text><text x="322" y="249">队列提升 → 重验归属</text><text x="322" y="277">首次 ACP 连接 → 读取真实能力</text><text x="677" y="249">image / text / resource 内容块 → ACP JSON-RPC</text><text x="677" y="277">Agent 异步回传状态和消息 → Host 保存并通知客户端</text><path d="M235 118H301M590 118H656M130 155V216M235 260H301M590 260H656" stroke="#666" stroke-width="2" fill="none"/><text x="25" y="345">预览：按会话 GET 附件 → 校验 read 范围 → Base64 内容 → 客户端受限图片 data URL / 文件下载。</text><text x="25" y="375">HTTP 拒绝：保留草稿。Agent 未声明能力：明确失败，允许恢复该轮输入并移除不支持附件。</text><text x="25" y="411" font-size="12" fill="#666">图片与文件不会被转成“只有名称”的假引用；工作区 @ 引用仍表示执行前重新读取，上传附件表示固定内容。</text></g></svg>
