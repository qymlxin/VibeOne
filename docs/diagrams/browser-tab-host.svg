<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="310" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc"><title id="title">网页标签与原生浏览宿主的调用边界</title><desc id="desc">编辑器标签通过异步 IPC 调用主进程，主进程管理 Chromium 网页视图。加载事件从主进程返回 UI。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#607086"/></marker></defs><rect width="1080" height="310" rx="14" fill="#f6f7f9"/><g font-family="system-ui,sans-serif" font-size="16" fill="#1a2636"><g fill="#fff" stroke="#c7d0dc"><rect x="30" y="70" width="250" height="140" rx="12"/><rect x="415" y="70" width="250" height="140" rx="12"/><rect x="800" y="70" width="250" height="140" rx="12"/></g><text x="52" y="107" font-weight="600">编辑器 UI / 标签页</text><text x="52" y="143">地址栏、区域尺寸、可见性</text><text x="52" y="177">客户端 browserView 通道</text><text x="437" y="107" font-weight="600">Electron 主进程</text><text x="437" y="143">BrowserViewMainService</text><text x="437" y="177">持久会话、权限、视图生命周期</text><text x="822" y="107" font-weight="600">WebContentsView</text><text x="822" y="143">Chromium 加载网页</text><text x="822" y="177">网络、脚本、浏览存储</text><text x="296" y="110" font-size="13">异步 IPC 调用</text><text x="297" y="190" font-size="13">加载 / 导航事件</text><text x="685" y="110" font-size="13">原生宿主 API</text><text x="685" y="190" font-size="13">webContents 事件</text><text x="30" y="266" font-size="14" fill="#607086">Tauri/macOS 现有路径：React → Tauri IPC → WKWebView/WebKit；不能直接调用 Electron WebContentsView。</text></g><g fill="none" stroke="#607086" stroke-width="1.5" marker-end="url(#arrow)"><path d="M280 127H415"/><path d="M415 163H280"/><path d="M665 127H800"/><path d="M800 163H665"/></g></svg>
