<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
<title id="title">停止执行与继续链路</title><desc id="desc">HTTP只确认取消受理，Host通过ACP关闭连接并排空进程树，之后异步发布已停止。新输入先恢复配置再发送。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker></defs>
<rect width="1040" height="650" rx="16" fill="#fff"/>
<g font-family="system-ui, sans-serif" fill="#242424">
<text x="40" y="40" font-size="21" font-weight="650">停止后先清理，再发布终止状态</text>
<text x="40" y="67" font-size="13" fill="#666">同步请求只确认受理；运行状态通过WebSocket异步更新</text>
<g fill="#f4f4f4" stroke="#ddd"><rect x="40" y="92" width="190" height="44" rx="9"/><rect x="310" y="92" width="190" height="44" rx="9"/><rect x="570" y="92" width="190" height="44" rx="9"/><rect x="810" y="92" width="190" height="44" rx="9"/></g>
<g font-size="15" text-anchor="middle" font-weight="600"><text x="135" y="120">桌面 / 手机</text><text x="405" y="120">Host</text><text x="665" y="120">ACP Agent</text><text x="905" y="120">本机工具进程树</text></g>
<g stroke="#ddd" stroke-dasharray="5 5"><path d="M135 140V615M405 140V615M665 140V615M905 140V615"/></g>
<g fill="none" stroke="#555" marker-end="url(#arrow)"><path d="M135 180H405"/><path d="M405 222H135" stroke-dasharray="5 4"/><path d="M405 270H665"/><path d="M665 315H405" stroke-dasharray="5 4"/><path d="M405 365H665"/><path d="M665 410H905"/><path d="M905 455H405" stroke-dasharray="5 4"/><path d="M405 500H135" stroke-dasharray="5 4"/><path d="M135 551H405"/><path d="M405 600H665"/></g>
<g font-size="13"><text x="156" y="170">HTTP POST /cancel</text><text x="156" y="212">200 已受理 · 正在停止</text><text x="425" y="260">ACP session/cancel</text><text x="425" y="305">异步idle · 仍待排空</text><text x="425" y="355">关闭连接 · SDK进程清理</text><text x="686" y="400">关闭 / EOF / 进程组退出</text><text x="541" y="445">清理路径完成 · 释放工作区租约</text><text x="156" y="490">WebSocket状态 · 已停止</text><text x="156" y="541">新消息 / 明确恢复队列</text><text x="425" y="590">新会话 → 恢复配置 → prompt</text></g>
<rect x="38" y="282" width="220" height="70" rx="9" fill="#f7f7f7" stroke="#ddd"/><text x="52" y="307" font-size="12">历史保留，排队消息暂停</text><text x="52" y="330" font-size="12">旧审批失效，不自动重放任务</text>
<rect x="775" y="535" width="230" height="77" rx="9" fill="#f7f7f7" stroke="#ddd"/><text x="790" y="560" font-size="12">继续使用新Agent上下文</text><text x="790" y="582" font-size="12">恢复模型、权限等原有配置</text><text x="790" y="601" font-size="12">恢复失败 → 不发送任务</text>
</g></svg>
