<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Chromium CDP 画面串流预览</title><desc id="desc">Tauri界面使用canvas显示后台Chrome画面，Rust通过CDP转发操作并接收截图事件。网页真正运行在Chrome进程中。</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#66758a"/></marker></defs><rect width="960" height="340" rx="16" fill="#f6f7f9"/><g fill="#fff" stroke="#cbd2dc"><rect x="30" y="70" width="230" height="175" rx="12"/><rect x="360" y="70" width="230" height="175" rx="12"/><rect x="700" y="70" width="230" height="175" rx="12"/></g><g font-family="system-ui,sans-serif" fill="#202b3a" font-size="16"><text x="52" y="108" font-weight="600">Tauri / React</text><text x="52" y="145">canvas 绘制网页画面</text><text x="52" y="177">捕获点击、键盘、滚动</text><text x="52" y="209">地址栏、标签仍是 React</text><text x="382" y="108" font-weight="600">Rust CDP 桥接</text><text x="382" y="145">启动 / 管理浏览器</text><text x="382" y="177">转发导航与输入命令</text><text x="382" y="209">转发 JPEG 截图事件</text><text x="722" y="108" font-weight="600">后台 Chrome / Edge</text><text x="722" y="145">Chromium 实际加载网页</text><text x="722" y="177">独立持久 profile</text><text x="722" y="209">headless=new + CDP</text><g font-size="12" fill="#59697d"><text x="278" y="114">异步 IPC 命令</text><text x="278" y="220">画面事件回传</text><text x="606" y="114">WebSocket 请求</text><text x="606" y="220">响应 / 帧事件</text></g></g><g stroke="#66758a" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M260 135H360"/><path d="M360 195H260"/><path d="M590 135H700"/><path d="M700 195H590"/></g><text x="30" y="292" font-family="system-ui,sans-serif" font-size="14" fill="#59697d">网页不在 WKWebView 或 iframe 中执行；界面显示浏览器传回的图像，输入需映射回网页。</text></svg>
