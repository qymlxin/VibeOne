<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350"><rect width="1000" height="350" rx="12" fill="#fafafa"/><g font-family="system-ui,sans-serif" font-size="14" fill="#222"><text x="28" y="35" font-size="19" font-weight="600">CLI 与桌面共享 Host 配置和会话</text><g fill="#fff" stroke="#aaa"><rect x="28" y="85" width="235" height="80" rx="8"/><rect x="340" y="85" width="300" height="80" rx="8"/><rect x="715" y="85" width="255" height="80" rx="8"/><rect x="340" y="225" width="300" height="72" rx="8"/><rect x="715" y="225" width="255" height="72" rx="8"/></g><text x="44" y="113">CLI：list / probe / session create</text><text x="44" y="140">读取本机 Host 连接信息</text><text x="356" y="113">授权 HTTP 请求（异步等待）</text><text x="356" y="140">GET 摘要 → 按 Profile ID 选择</text><text x="731" y="113">运行中的 Host</text><text x="731" y="140">校验配置，执行原有业务</text><text x="356" y="253">CLI 输出 JSON，失败返回非零</text><text x="356" y="278">不输出令牌或配置启动参数</text><text x="731" y="253">只读探测 / 创建本地会话</text><text x="731" y="278">创建时固定修订；不发送任务</text><path d="M263 125H336M640 125H711M842 165V221M715 261H644M340 261H145V169" fill="none" stroke="#666" stroke-width="2"/><text x="28" y="329" font-size="12" fill="#666">仅回环地址，无代理或重定向；CLI 不打开 SQLite；Host 继续管理状态、权限与持久化。失败不自动重试。</text></g></svg>
