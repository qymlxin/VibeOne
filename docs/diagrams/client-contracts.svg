<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
<title id="title">共享请求类型的来源与运行链路</title><desc id="desc">实际Rust HTTP DTO导出JSON Schema，再生成TypeScript。客户端构造器编译使用生成类型，运行时经HTTP调用使用相同Rust DTO的Host。检查重新导出比对并执行类型反例。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#657080"/></marker></defs><rect width="980" height="460" rx="16" fill="white"/>
<g font-family="system-ui,sans-serif" fill="#1a1c1f"><text x="30" y="40" font-size="21" font-weight="600">同一份Rust定义，生成客户端类型</text>
<g fill="#f4f5f7" stroke="#cbd0d7"><rect x="30" y="82" width="240" height="86" rx="10"/><rect x="370" y="82" width="240" height="86" rx="10"/><rect x="710" y="82" width="240" height="86" rx="10"/><rect x="710" y="270" width="240" height="86" rx="10"/><rect x="30" y="270" width="240" height="86" rx="10"/></g>
<g font-size="16" font-weight="600"><text x="50" y="113">Rust HTTP DTO</text><text x="390" y="113">JSON Schema</text><text x="730" y="113">生成TypeScript类型</text><text x="730" y="301">桌面 / 手机构造器</text><text x="50" y="301">Host请求解析 / 回执</text></g>
<g font-size="13" fill="#505965"><text x="50" y="143">实际生产定义，不另抄字段</text><text x="390" y="143">导出字段、默认值与可空规则</text><text x="730" y="143">已提交产物，禁止手工修改</text><text x="730" y="331">编译时检查生成类型</text><text x="50" y="331">直接使用同一Rust DTO</text></g>
<g stroke="#657080" fill="none" marker-end="url(#a)"><path d="M270 125H360"/><path d="M610 125H700"/><path d="M830 168V260"/><path d="M710 300H280"/><path d="M270 340H700"/><path d="M150 168V260"/></g>
<g font-size="13"><text x="281" y="106">导出</text><text x="626" y="106">生成</text><text x="840" y="220">构建</text><text x="412" y="290">HTTP JSON请求</text><text x="412" y="330">HTTP JSON回执</text><text x="160" y="220">服务端编译</text></g>
<text x="30" y="404" font-size="15">检查：重新导出比对 + TypeScript正反例；产物过期或调用不匹配 → 构建失败</text><text x="30" y="438" font-size="13" fill="#505965">Schema描述传输字段；工作区权限、文件校验和业务限制仍由Host执行。</text></g></svg>
