<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><rect width="900" height="300" rx="14" fill="#fafafa"/><g font-family="system-ui,sans-serif" fill="#242424"><text x="28" y="38" font-size="19" font-weight="600">同一个输入框，明确区分执行路径</text><g fill="#fff" stroke="#ccc"><rect x="28" y="76" width="195" height="172" rx="9"/><rect x="332" y="76" width="535" height="46" rx="8"/><rect x="332" y="139" width="535" height="46" rx="8"/><rect x="332" y="202" width="535" height="46" rx="8"/></g><g font-size="14"><text x="47" y="113">/  指令与技能菜单</text><text x="47" y="151">@  Agent候选</text><text x="47" y="190" fill="#666">管家 / 群组 / 独立Agent</text><text x="47" y="222" fill="#666">共用建议与键盘操作</text><text x="350" y="105">本地工具指令 → 打开右侧工具，不发送Agent任务</text><text x="350" y="168">独立对话提及 → 插入@名字，仍发送给当前Agent</text><text x="350" y="231">会话组提及 → Host验证成员并异步派发，结果回到组内</text></g><g stroke="#888" fill="none"><path d="M223 100H332M223 160H290V162H332M223 222H332"/></g></g></svg>
