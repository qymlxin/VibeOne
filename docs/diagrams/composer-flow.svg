<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><rect width="900" height="320" rx="12" fill="#fafafa"/><g font-family="system-ui,sans-serif" font-size="14" fill="#222"><text x="30" y="35" font-size="19" font-weight="600">输入框：指令、技能与文件引用</text><g fill="#fff" stroke="#aaa"><rect x="30" y="125" width="135" height="65" rx="8"/><rect x="230" y="70" width="225" height="65" rx="8"/><rect x="230" y="200" width="225" height="65" rx="8"/><rect x="520" y="70" width="340" height="65" rx="8"/><rect x="520" y="200" width="340" height="65" rx="8"/></g><text x="48" y="152">输入 / 或 @</text><text x="48" y="175">键盘 / 点击选择</text><text x="247" y="97">/：ACP 命令 / 项目技能</text><text x="247" y="119">技能附引用；本地指令打开侧栏</text><text x="247" y="227">@：Host HTTP 读取目录</text><text x="247" y="249">目录可刷新 → 文件 / 文件夹标签</text><text x="537" y="97">用户确认发送 → Host 消息队列</text><text x="537" y="119">Agent 通过 ACP 异步处理并回传事件</text><text x="537" y="227">Host 校验路径、类型及文件大小</text><text x="537" y="249">执行前重读 → 文件正文 / 目录清单</text><path d="M165 150L210 103H227M165 170L210 232H227M455 103H517M455 232H517M690 200V139" fill="none" stroke="#666" stroke-width="2"/><text x="30" y="300" fill="#666" font-size="12">目录查询异步返回；菜单选择为本地操作；发送成功清空草稿及引用，失败保留。</text></g></svg>
