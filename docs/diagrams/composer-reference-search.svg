<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380"><rect width="960" height="380" fill="#181818"/><g font-family="system-ui,sans-serif" fill="#eee"><text x="28" y="38" font-size="20">@ 文件引用：浏览与检索</text><g fill="#262626" stroke="#555"><rect x="28" y="80" width="175" height="70" rx="10"/><rect x="285" y="66" width="290" height="64" rx="10"/><rect x="285" y="170" width="290" height="80" rx="10"/><rect x="650" y="110" width="280" height="95" rx="10"/><rect x="650" y="280" width="280" height="60" rx="10"/></g><g font-size="15"><text x="46" y="110">输入 @文件名 / 路径</text><text x="46" y="132" fill="#aaa">React · 35ms 防抖</text><text x="304" y="92">空查询或 / 结尾 → 目录浏览</text><text x="304" y="115" fill="#aaa">HTTP GET /tree</text><text x="304" y="197">其他查询 → 工作目录文件名索引</text><text x="304" y="220" fill="#aaa">HTTP GET /references · Host 匹配排序</text><text x="304" y="240" fill="#aaa">Git 文件清单 / 有界目录扫描</text><text x="670" y="138">返回名称、路径、类型及截断状态</text><text x="670" y="162" fill="#aaa">React 展示结果，丢弃过期响应</text><text x="670" y="186" fill="#aaa">进入目录 / 选择文件 → 引用标签</text><text x="670" y="305">用户发送 → Host 校验并读取引用</text><text x="670" y="328" fill="#aaa">通过 ACP 携带上下文 → Agent</text><text x="28" y="338" fill="#aaa">检索只读取文件名；选择本身不发送消息、不调用模型。</text></g></g><g stroke="#9ab6ff" stroke-width="2" fill="none"><path d="M203 108h36V98h36m-7-5 7 5-7 5M239 108v102h36m-7-5 7 5-7 5M575 98h35v43h30m-7-5 7 5-7 5M575 210h35v-35h30m-7-5 7 5-7 5M790 205v65m-5-7 5 7 5-7"/></g></svg>
