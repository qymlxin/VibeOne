<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340"><rect width="820" height="340" rx="12" fill="#fafafa"/><style>text{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#252525}.sub{font-size:12px;fill:#626262}.box{fill:white;stroke:#d5d5d5}.link{fill:none;stroke:#888;stroke-width:1.4;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#888"/></marker></defs><text x="26" y="32" font-weight="600">输入区选择器：选择与执行分开</text><rect class="box" x="26" y="62" width="128" height="98" rx="8"/><text x="44" y="91">/ 指令与技能</text><text class="sub" x="44" y="118">按能力展示</text><text class="sub" x="44" y="138">不自动发送任务</text><path class="link" d="M154 93H212"/><path class="link" d="M154 137H212"/><rect class="box" x="216" y="62" width="230" height="58" rx="8"/><text x="232" y="87">模型 / 思考强度 / 工作模式</text><text class="sub" x="232" y="107">组内先明确要配置的成员</text><rect class="box" x="216" y="132" width="230" height="52" rx="8"/><text x="232" y="155">项目技能 / Agent 原生命令</text><text class="sub" x="232" y="174">添加技能引用或插入命令</text><path class="link" d="M446 91H506"/><rect class="box" x="510" y="62" width="278" height="58" rx="8"/><text x="526" y="87">异步调用配置接口</text><text class="sub" x="526" y="107">真实选项 · 状态回执 · 失败可重试</text><rect class="box" x="26" y="216" width="128" height="82" rx="8"/><text x="44" y="245">@ 添加上下文</text><text class="sub" x="44" y="271">Agent + 文件</text><path class="link" d="M154 256H212"/><rect class="box" x="216" y="216" width="230" height="82" rx="8"/><text x="232" y="242">@成员 / 文件引用标签</text><text class="sub" x="232" y="265">保留任务正文与引用路径</text><text class="sub" x="232" y="284">发送前仍可移除</text><path class="link" d="M446 256H506"/><path class="link" d="M446 157H481V235H506"/><rect class="box" x="510" y="216" width="278" height="82" rx="8"/><text x="526" y="242">用户确认发送</text><text class="sub" x="526" y="265">普通会话：Host校验并读取引用</text><text class="sub" x="526" y="284">会话组：授权读取后作为文本发送</text></svg>
