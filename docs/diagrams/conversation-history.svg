<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1040" height="460" rx="16" fill="#f8fafc"/>
<g font-family="system-ui,sans-serif" fill="#17212e"><text x="32" y="40" font-size="21" font-weight="600">完整历史：事务保存、分页读取与实时合并</text>
<g fill="white" stroke="#cbd5e1"><rect x="32" y="82" width="235" height="102" rx="10"/><rect x="342" y="82" width="300" height="102" rx="10"/><rect x="715" y="82" width="292" height="102" rx="10"/><rect x="342" y="254" width="300" height="106" rx="10"/><rect x="715" y="254" width="292" height="106" rx="10"/><rect x="32" y="254" width="235" height="106" rx="10"/></g>
<g font-size="15"><text x="49" y="111" font-weight="600">Agent → Rust Host</text><text x="49" y="140">ACP 异步消息 / 工具事件</text><text x="49" y="164">旧 ID 更新前先恢复已有内容</text>
<text x="361" y="111" font-weight="600">一次 SQLite 事务</text><text x="361" y="140">会话投影 + event_log + 历史档案</text><text x="361" y="164">historyOrder 身份 / Revision 修订</text>
<text x="734" y="111" font-weight="600">桌面 / 手机实时窗口</text><text x="734" y="140">WS 通知 → HTTP 快照</text><text x="734" y="164">最新 128 消息 / 100 工具</text>
<text x="361" y="283" font-weight="600">GET /sessions/:id/history</text><text x="361" y="312">before 游标 · 每页最多 256 记录</text><text x="361" y="338">复用角色与工作区读取权限</text>
<text x="734" y="283" font-weight="600">客户端历史缓存</text><text x="734" y="312">按顺序去重，较新修订胜出</text><text x="734" y="338">加载旧页 / 重连补齐 / 可见记录锚定</text>
<text x="49" y="283" font-weight="600">旧版本数据首次升级</text><text x="49" y="312">事件回放 + 批次断点</text><text x="49" y="338">只回填数据，不重启任务</text></g>
<g fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"><path d="M267 132H340"/><path d="M642 132H713"/><path d="M492 254V186"/><path d="M267 305H340"/><path d="M642 305H713"/><path d="M861 184V252"/></g>
<text x="32" y="403" font-size="14" fill="#475569">发送 / 事件提交为异步业务；分页为 HTTP 请求响应。旧页不覆盖新流式内容，加载历史不跳回底部。</text>
<text x="32" y="430" font-size="14" fill="#475569">快照导入缺少早期事件时明确提示可恢复范围；不根据今天的文件内容伪造过去的引用。</text></g></svg>
