<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
<title id="title">核心工作闭环</title><desc id="desc">会话由主机统一执行，桌面与手机共享查看和控制能力</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<rect width="1280" height="740" fill="#f3f3f1"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#62645c" stroke-width="1.5"/></marker></defs>
<text x="40" y="60" font-size="28" font-weight="650" fill="#252622">核心工作闭环</text>
<text x="40" y="94" font-size="15" font-weight="400" fill="#62645c">会话由主机统一执行，桌面与手机共享查看和控制能力</text>
<rect x="40" y="145" width="360" height="132" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="58" y="177" font-size="18" font-weight="600" fill="#252622">1. 授权工作区</text>
<text x="58" y="206" font-size="14" font-weight="400" fill="#62645c">选择已有本地目录。</text>
<text x="58" y="229" font-size="14" font-weight="400" fill="#62645c">识别 Git，保留用户已有修改。</text>
<text x="58" y="252" font-size="14" font-weight="400" fill="#62645c">不隐式初始化仓库。</text>
<rect x="460" y="145" width="360" height="132" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="478" y="177" font-size="18" font-weight="600" fill="#252622">2. 选择 Agent 配置</text>
<text x="478" y="206" font-size="14" font-weight="400" fill="#62645c">检查运行条件与登录状态。</text>
<text x="478" y="229" font-size="14" font-weight="400" fill="#62645c">协商并展示实际可用能力。</text>
<text x="478" y="252" font-size="14" font-weight="400" fill="#62645c">不支持的操作保持不可用。</text>
<rect x="880" y="145" width="360" height="132" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="898" y="177" font-size="18" font-weight="600" fill="#252622">3. 创建会话</text>
<text x="898" y="206" font-size="14" font-weight="400" fill="#62645c">绑定一个工作区和一份 Agent 配置。</text>
<text x="898" y="229" font-size="14" font-weight="400" fill="#62645c">受理输入并返回命令回执。</text>
<text x="898" y="252" font-size="14" font-weight="400" fill="#62645c">为受理的本轮输入创建一次执行。</text>
<path d="M400,211 L460,211" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M820,211 L880,211" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1060,277 L1060,385" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="880" y="385" width="360" height="132" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="898" y="417" font-size="18" font-weight="600" fill="#252622">4. 跟进执行</text>
<text x="898" y="446" font-size="14" font-weight="400" fill="#62645c">流式展示消息和工具活动。</text>
<text x="898" y="469" font-size="14" font-weight="400" fill="#62645c">新输入进入下一轮队列。</text>
<text x="898" y="492" font-size="14" font-weight="400" fill="#62645c">通过有回执的流程取消执行。</text>
<rect x="460" y="385" width="360" height="132" rx="6" fill="#faf5e9" stroke="#e7d8b8"/>
<text x="478" y="417" font-size="18" font-weight="600" fill="#252622">5. 处理人工待办</text>
<text x="478" y="446" font-size="14" font-weight="400" fill="#62645c">仅在收到真实请求时出现。</text>
<text x="478" y="469" font-size="14" font-weight="400" fill="#62645c">使用原始选项或规定的回答结构。</text>
<text x="478" y="492" font-size="14" font-weight="400" fill="#62645c">多设备只接受一个有效决定。</text>
<rect x="40" y="385" width="360" height="132" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="58" y="417" font-size="18" font-weight="600" fill="#252622">6. 检查结果并继续</text>
<text x="58" y="446" font-size="14" font-weight="400" fill="#62645c">执行结束与测试成功分别记录。</text>
<text x="58" y="469" font-size="14" font-weight="400" fill="#62645c">检查当前工作区变更。</text>
<text x="58" y="492" font-size="14" font-weight="400" fill="#62645c">继续当前会话，或保留为空闲。</text>
<path d="M880,451 L820,451" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M460,451 L400,451" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="740" y="346" font-size="14" font-weight="400" fill="#62645c">主机持有执行状态与历史记录</text>
<rect x="40" y="580" width="1200" height="116" rx="6" fill="#f7f7f5" stroke="#d3d5cd"/>
<text x="58" y="612" font-size="18" font-weight="600" fill="#252622">桌面与手机共享同一套业务事实</text>
<text x="58" y="641" font-size="14" font-weight="400" fill="#62645c">可信配对后，设备才能访问指定工作区。</text>
<text x="58" y="664" font-size="14" font-weight="400" fill="#62645c">重连恢复有权查看的历史；离线时不提交审批，也不发送执行命令。</text>
</svg>
