<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380"><rect width="1040" height="380" rx="14" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#17212e"><text x="28" y="36" font-size="20" font-weight="600">桌面包：资源独立，认证留在本机</text><g fill="#fff" stroke="#cbd5e1"><rect x="28" y="90" width="222" height="102" rx="9"/><rect x="330" y="90" width="275" height="102" rx="9"/><rect x="686" y="90" width="325" height="102" rx="9"/><rect x="330" y="250" width="275" height="86" rx="9"/><rect x="686" y="250" width="325" height="86" rx="9"/></g><g font-size="14"><text x="44" y="118" font-weight="600">Electron 桌面</text><text x="44" y="145">通过资源路径启动 Host</text><text x="44" y="172">HTTP / WS 连接业务</text><text x="346" y="118" font-weight="600">包内 Rust Host</text><text x="346" y="145">会话、队列、审批与持久历史</text><text x="346" y="172">明确配置桥接器 / 插件资源目录</text><text x="702" y="118" font-weight="600">包内 ACP 桥接器 + CLI</text><text x="702" y="145">Node ESM入口与锁定生产依赖</text><text x="702" y="172">独立进程 · ACP v2 / stdio 异步事件</text><text x="346" y="278" font-weight="600">包内插件 Runner / SDK / 示例</text><text x="346" y="309">Node Worker · 双向 RPC</text><text x="702" y="278" font-weight="600">本机外部条件</text><text x="702" y="309">Node 22+、模型认证、用户工作区</text></g><g stroke="#64748b" stroke-width="1.6" fill="none"><path d="M250 138H327L319 133M327 138L319 143M605 138H683L675 133M683 138L675 143M468 192V247L463 239M468 247L473 239M850 192V247L845 239M850 247L855 239"/></g><text x="28" y="362" font-size="12" fill="#475569">构建复制程序和依赖，不复制用户认证。验证使用仓库外副本，完整包不依赖开发机 node_modules。</text></g></svg>
