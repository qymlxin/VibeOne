<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><rect width="960" height="400" rx="12" fill="#fafafa"/><g font-family="system-ui,sans-serif" fill="#222"><text x="28" y="36" font-size="20" font-weight="600">设备授权：共用状态判断，明确公开字段</text><g fill="#fff" stroke="#aaa"><rect x="28" y="80" width="210" height="95" rx="10"/><rect x="338" y="80" width="250" height="95" rx="10"/><rect x="688" y="80" width="244" height="95" rx="10"/><rect x="338" y="255" width="250" height="105" rx="10"/><rect x="688" y="255" width="244" height="105" rx="10"/></g><g font-size="15"><text x="45" y="111" font-weight="600">主机设备记录</text><text x="45" y="140">角色 / 范围 / 到期 / 撤销</text><text x="45" y="160">凭据摘要及私有字段</text><text x="355" y="111" font-weight="600">统一授权状态</text><text x="355" y="140">有效 · 过期 · 撤销 · 异常</text><text x="355" y="160">按主机时间与真实字段判断</text><text x="705" y="111" font-weight="600">身份与配对凭据交付</text><text x="705" y="140">仅有效状态且凭据匹配</text><text x="705" y="160">再按角色 / 工作区授权</text><text x="355" y="286" font-weight="600">公开 RemoteDeviceSummary</text><text x="355" y="315">只构造允许的公开字段</text><text x="355" y="337">不透传原始存储 JSON</text><text x="705" y="286" font-weight="600">桌面设备管理</text><text x="705" y="315">显示角色、范围及授权状态</text><text x="705" y="337">异常提示 / 明确撤销</text></g><g fill="none" stroke="#666" stroke-width="2"><path d="M238 127H330m-7-5 7 5-7 5M588 127H680m-7-5 7 5-7 5M463 175V247m-5-7 5 7 5-7M588 306H680m-7-5 7 5-7 5"/></g><g font-size="12" fill="#555"><text x="28" y="388">已撤销、已过期或格式异常的记录不会继续交付凭据；界面使用同一 Host 状态。</text></g></g></svg>
