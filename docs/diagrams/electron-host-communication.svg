<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="460" viewBox="0 0 1060 460"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 7 3.5 0 7" fill="#666"/></marker></defs><rect width="1060" height="460" rx="16" fill="#fafafa"/><g font-family="system-ui,sans-serif" fill="#242424"><text x="38" y="42" font-size="22" font-weight="600">桌面与 Rust Host 通信</text><text x="38" y="68" font-size="13" fill="#666">请求等待响应；任务和事件异步执行、推送</text><g fill="#fff" stroke="#ccc"><rect x="38" y="120" width="220" height="115" rx="10"/><rect x="397" y="120" width="240" height="115" rx="10"/><rect x="780" y="120" width="240" height="115" rx="10"/><rect x="780" y="335" width="240" height="80" rx="10"/></g><g font-size="17" font-weight="600" text-anchor="middle"><text x="148" y="154">React 渲染进程</text><text x="517" y="154">Electron 主进程</text><text x="900" y="154">Rust Host</text><text x="900" y="368">Agent 适配器</text></g><g font-size="12" text-anchor="middle" fill="#666"><text x="148" y="181">会话、审批、项目界面</text><text x="148" y="204">通过 preload 白名单访问桌面</text><text x="517" y="181">窗口 / 终端 / Chromium网页</text><text x="517" y="204">启动或复用独立 Host</text><text x="900" y="181">持久化 / 审批 / 插件 / ACP</text><text x="900" y="204">本机动态端口 + Bearer鉴权</text><text x="900" y="394">编码工具与模型执行</text></g><g stroke="#666" fill="none" marker-start="url(#a)" marker-end="url(#a)"><path d="M265 170H390"/><path d="M644 170H773"/><path d="M148 242V280H900V242"/><path stroke-dasharray="5 4" d="M148 242V314H745V220H773"/><path d="M900 242V328"/></g><g font-size="12" text-anchor="middle"><text x="328" y="114">IPC invoke / response</text><text x="328" y="254" fill="#666">输出与网页状态经IPC推送</text><text x="708" y="114">HTTP / JSON</text><rect x="336" y="268" width="320" height="22" fill="#fafafa"/><text x="496" y="284">React → Host：HTTP / JSON 业务请求</text><rect x="336" y="303" width="320" height="22" fill="#fafafa"/><text x="496" y="319">Host → React：WebSocket 异步事件</text><text x="958" y="272">ACP</text><text x="958" y="292">JSON-RPC</text><text x="958" y="312">stdio</text></g><text x="38" y="414" font-size="12" fill="#666">远程手机：独立 HTTPS 入口 + 配对鉴权；外部网页不持有工作台 IPC 或 Host 令牌。</text></g></svg>
