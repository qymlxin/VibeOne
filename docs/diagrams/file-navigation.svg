<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330"><rect width="940" height="330" rx="12" fill="#fafafa"/><g font-family="system-ui,sans-serif" fill="#222"><text x="28" y="36" font-size="20" font-weight="600">文件目录：读取成功后再切换</text><g fill="#fff" stroke="#aaa"><rect x="28" y="88" width="220" height="85" rx="10"/><rect x="350" y="88" width="230" height="85" rx="10"/><rect x="680" y="65" width="232" height="85" rx="10"/><rect x="680" y="205" width="232" height="85" rx="10"/></g><g font-size="15"><text x="44" y="117" font-weight="600">编辑目录地址 / 点击层级</text><text x="44" y="145">保留当前列表与文件预览</text><text x="367" y="117" font-weight="600">Host 授权目录查询</text><text x="367" y="145">HTTP 异步返回 · 显示读取状态</text><text x="697" y="96" font-weight="600">成功：切换当前目录</text><text x="697" y="124">同步地址 / 层级，清空筛选</text><text x="697" y="236" font-weight="600">失败：原目录不变</text><text x="697" y="264">显示错误，保留输入并可重试</text></g><g fill="none" stroke="#666" stroke-width="2"><path d="M248 129H342m-7-5 7 5-7 5M580 122H626V105H672m-7-5 7 5-7 5M626 122V247H672m-7-5 7 5-7 5M680 247H465V181m-5 7 5-7 5 7"/></g><g font-size="12" fill="#555"><text x="274" y="113">确认打开</text><text x="484" y="235">重试读取</text><text x="28" y="310">子目录失败提供独立重试；切换会话后丢弃旧请求结果。</text></g></g></svg>
