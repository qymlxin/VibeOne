<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-labelledby="title desc">
<title id="title">初始化期间的人工等待预算</title><desc id="desc">启动工作累计30秒。成功发布人工请求后暂停工作预算，每个请求独立等待600秒。作答后继续剩余工作时间；取消或失败清理请求与进程。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="880" height="470" rx="16" fill="#fff"/>
<g font-family="system-ui,sans-serif" fill="#1a1c1f"><text x="32" y="42" font-size="21" font-weight="600">初始化：工作计时与人工等待分开处理</text>
<g fill="#f5f6f8" stroke="#cbd0d7"><rect x="32" y="84" width="230" height="92" rx="10"/><rect x="324" y="84" width="230" height="92" rx="10"/><rect x="616" y="84" width="230" height="92" rx="10"/>
<rect x="324" y="246" width="230" height="88" rx="10"/><rect x="616" y="246" width="230" height="88" rx="10"/></g>
<g font-size="16" font-weight="600"><text x="52" y="116">启动与协议工作</text><text x="344" y="116">已发布人工请求</text><text x="636" y="116">用户作答</text><text x="344" y="278">请求等待超时</text><text x="636" y="278">继续初始化</text></g>
<g font-size="14" fill="#505965"><text x="52" y="147">累计预算：30 秒</text><text x="344" y="147">工作暂停；每个请求 600 秒</text><text x="636" y="147">结束该请求的等待</text><text x="344" y="308">返回取消；拒绝迟到答案</text><text x="636" y="308">恢复剩余预算，不重置</text></g>
<g stroke="#64748b" fill="none" marker-end="url(#arrow)"><path d="M262 130H314"/><path d="M554 130H606"/><path d="M439 176V236"/><path d="M731 176V236"/></g>
<text x="32" y="388" font-size="15">就绪 → 进入会话；工作预算耗尽 / 取消 / 失败 → 使旧请求失效并清理进程</text>
<text x="32" y="424" font-size="14" fill="#505965">多个请求重叠只暂停一次；请求发布、回执及协议收发耗时仍计入工作预算。</text></g></svg>
