<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310"><rect width="960" height="310" rx="14" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#17212e"><text x="28" y="35" font-size="20" font-weight="600">通知：本设备偏好与系统授权分别管理</text><g stroke="#cbd5e1" fill="#fff"><rect x="28" y="82" width="235" height="108" rx="10"/><rect x="355" y="82" width="245" height="108" rx="10"/><rect x="692" y="82" width="240" height="108" rx="10"/></g><g font-size="14"><text x="44" y="112" font-weight="600">React 通知设置</text><text x="44" y="141">开关 → 本设备偏好</text><text x="44" y="166">刷新 / 窗口聚焦 → 查询权限</text><text x="371" y="112" font-weight="600">Tauri Rust 命令</text><text x="371" y="141">IPC 请求 → 等待系统回调</text><text x="371" y="166">超时或失败 → 返回明确错误</text><text x="708" y="112" font-weight="600">macOS UserNotifications</text><text x="708" y="141">查询：不弹窗</text><text x="708" y="166">授权：仅用户开启提醒时请求</text></g><g stroke="#64748b" fill="none" stroke-width="1.5"><path d="M263 122H352L345 118M352 122L345 126M600 122H689L682 118M689 122L682 126M692 160H603L610 156M603 160L610 164M355 160H266L273 156M266 160L273 164"/></g><text x="28" y="232" font-size="14">首份有效快照只建立基线；后续新事件 → 检查本设备偏好与权限 → 实际发送。</text><text x="28" y="269" font-size="13" fill="#475569">手机 / 浏览器直接使用 Notification API。系统拒绝、不可用或查询失败时不显示虚假的“已授权”。</text></g></svg>
