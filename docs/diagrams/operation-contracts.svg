<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380"><rect width="960" height="380" rx="12" fill="#fafafa"/><g font-family="system-ui,sans-serif" fill="#222"><text x="28" y="36" font-size="20" font-weight="600">插件后台操作：持久记录与公开响应</text><g fill="#fff" stroke="#aaa"><rect x="28" y="85" width="220" height="95" rx="10"/><rect x="350" y="85" width="250" height="95" rx="10"/><rect x="700" y="85" width="232" height="95" rx="10"/><rect x="350" y="255" width="250" height="95" rx="10"/><rect x="700" y="255" width="232" height="95" rx="10"/></g><g font-size="15"><text x="45" y="115" font-weight="600">SQLite 操作目录</text><text x="45" y="143">目录身份 / 状态 / 结果</text><text x="45" y="165">指纹与内部字段保持私有</text><text x="367" y="115" font-weight="600">实际 Rust 响应类型</text><text x="367" y="143">回执 · 摘要 · 单项详情</text><text x="367" y="165">逐字段投影，不改写旧记录</text><text x="717" y="115" font-weight="600">HTTP / Snapshot</text><text x="717" y="143">摘要隐藏结果与私有字段</text><text x="717" y="165">详情保留 false / 0 / null</text><text x="367" y="285" font-weight="600">Schema / TypeScript</text><text x="367" y="313">由同一生产结构生成</text><text x="367" y="335">漂移检查与类型反例</text><text x="717" y="285" font-weight="600">插件页核对结果</text><text x="717" y="313">缺省时间明确显示未知</text><text x="717" y="335">异常记录不冒充成功</text></g><g fill="none" stroke="#666" stroke-width="2"><path d="M248 132H342m-7-5 7 5-7 5M600 132H692m-7-5 7 5-7 5M475 180V247m-5-7 5 7 5-7M816 180V247m-5-7 5 7 5-7M600 302H692m-7-5 7 5-7 5"/></g><text x="28" y="371" font-size="12" fill="#555">保留明确幂等身份；旧记录身份异常时拒绝假回执，活跃状态继续参与重启保护。</text></g></svg>
