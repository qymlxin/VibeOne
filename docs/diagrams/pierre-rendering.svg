<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc"><title id="title">Pierre 渲染数据流</title><desc id="desc">Host 返回文件与补丁，React 适配层连接 Pierre 文件树和差异组件。点击文件只在面板内部更新预览。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#65758b"/></marker></defs><rect width="1000" height="340" rx="16" fill="#f6f7f9"/><g font-family="system-ui,sans-serif" font-size="16" fill="#1a2636"><g fill="#fff" stroke="#cbd2dc"><rect x="30" y="92" width="210" height="145" rx="12"/><rect x="345" y="92" width="245" height="145" rx="12"/><rect x="705" y="35" width="265" height="110" rx="12"/><rect x="705" y="195" width="265" height="110" rx="12"/></g><text x="55" y="128" font-weight="600">Rust Host</text><text x="55" y="163">/changes · /diff · /file</text><text x="55" y="198">/tree · 路径授权校验</text><text x="370" y="128" font-weight="600">React 数据适配层</text><text x="370" y="163">会话 · 选择 · 目录缓存</text><text x="370" y="198">异步读取 / 状态与主题</text><text x="728" y="71" font-weight="600">@pierre/trees</text><text x="728" y="108">目录、图标、Git 状态</text><text x="728" y="232" font-weight="600">@pierre/diffs</text><text x="728" y="268">补丁、着色、吸顶、虚拟化</text><text x="250" y="143" font-size="13">本机 HTTP</text><text x="251" y="195" font-size="13">异步响应</text><text x="618" y="72" font-size="13">模型更新</text><text x="615" y="272" font-size="13">补丁/内容</text><text x="849" y="178" font-size="13">点击选择 · 同步回调</text></g><g fill="none" stroke="#65758b" stroke-width="1.5" marker-end="url(#arrow)"><path d="M345 156H240"/><path d="M240 177H345"/><path d="M590 140 705 90"/><path d="M590 195 705 250"/><path d="M838 145V195"/></g><text x="30" y="310" font-family="system-ui,sans-serif" font-size="13" fill="#65758b">文件读取保持只读；点击文件与切换主题均不启动 Agent。</text></svg>
