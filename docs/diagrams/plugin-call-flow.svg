<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" role="img" aria-labelledby="title desc">
<title id="title">插件后台调用时序</title><desc id="desc">插件 HTTP 等待最终结果，Worker 经 stdio RPC 执行；进度用 WS 变更通知与快照读取，SDK 异步等待</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<rect width="1280" height="1100" fill="#f3f3f1"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#62645c" stroke-width="1.5"/></marker></defs>
<text x="40" y="60" font-size="28" font-weight="650" fill="#252622">插件后台调用时序</text>
<text x="40" y="94" font-size="15" font-weight="400" fill="#62645c">插件 HTTP 等待最终结果，Worker 经 stdio RPC 执行；进度用 WS 变更通知与快照读取，SDK 异步等待</text>
<rect x="270" y="125" width="735" height="855" rx="8" fill="#ffffff" stroke="#d3d5cd"/>
<text x="290" y="148" font-size="13" font-weight="400" fill="#62645c">同一个 Rust Host 进程：内部调用不经过 HTTP</text>
<rect x="40" y="170" width="200" height="84" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="58" y="202" font-size="18" font-weight="600" fill="#252622">桌面 / 手机 App</text>
<text x="58" y="231" font-size="14" font-weight="400" fill="#62645c">浏览器 SDK</text>
<line x1="140" y1="254" x2="140" y2="960" stroke="#c6c8c0" stroke-dasharray="4 5"/>
<rect x="290" y="170" width="200" height="84" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="308" y="202" font-size="18" font-weight="600" fill="#252622">API 与事件网关</text>
<text x="308" y="231" font-size="14" font-weight="400" fill="#62645c">HTTP(S) / WS(S)</text>
<line x1="390" y1="254" x2="390" y2="960" stroke="#c6c8c0" stroke-dasharray="4 5"/>
<rect x="540" y="170" width="200" height="84" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="558" y="202" font-size="18" font-weight="600" fill="#252622">插件调度模块</text>
<text x="558" y="231" font-size="14" font-weight="400" fill="#62645c">路由 / 代次租约</text>
<line x1="640" y1="254" x2="640" y2="960" stroke="#c6c8c0" stroke-dasharray="4 5"/>
<rect x="785" y="170" width="200" height="84" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="803" y="202" font-size="18" font-weight="600" fill="#252622">宿主业务模块</text>
<text x="803" y="231" font-size="14" font-weight="400" fill="#62645c">文件 / 数据 / 凭据</text>
<line x1="885" y1="254" x2="885" y2="960" stroke="#c6c8c0" stroke-dasharray="4 5"/>
<rect x="1030" y="170" width="200" height="84" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="1048" y="202" font-size="18" font-weight="600" fill="#252622">后台插件 Worker</text>
<text x="1048" y="231" font-size="14" font-weight="400" fill="#62645c">Node.js</text>
<line x1="1130" y1="254" x2="1130" y2="960" stroke="#c6c8c0" stroke-dasharray="4 5"/>
<path d="M140,285 L390,285" fill="none" stroke="#486778" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="265.0" y="274" text-anchor="middle" font-size="13" fill="#486778">① HTTP(S) POST：提交插件命令</text>
<path d="M390,340 L640,340" fill="none" stroke="#486778" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="515.0" y="329" text-anchor="middle" font-size="13" fill="#486778">② 内部调用：校验权限与代次</text>
<path d="M640,385 L390,385" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="515.0" y="374" text-anchor="middle" font-size="13" fill="#62645c">返回本地代次租约</text>
<text x="40" y="430" font-size="13" font-weight="400" fill="#62645c">③ 客户端 Promise 挂起；HTTP 等待最终结果</text>
<path d="M640,485 L1130,485" fill="none" stroke="#486778" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="885.0" y="474" text-anchor="middle" font-size="13" fill="#486778">④ stdio JSON-RPC 请求：plugin/invoke</text>
<path d="M1130,545 L885,545" fill="none" stroke="#486778" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1007.5" y="534" text-anchor="middle" font-size="13" fill="#486778">⑤ 按需反向请求：host/call</text>
<path d="M885,600 L1130,600" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="1007.5" y="589" text-anchor="middle" font-size="13" fill="#62645c">RPC result / error</text>
<path d="M1130,655 L640,655" fill="none" stroke="#32734e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="885.0" y="644" text-anchor="middle" font-size="13" fill="#32734e">⑥ 无需响应的通知：plugin/progress</text>
<path d="M640,710 L390,710" fill="none" stroke="#32734e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="515.0" y="699" text-anchor="middle" font-size="13" fill="#32734e">更新内存进度投影，发布变更通知</text>
<path d="M390,765 L140,765" fill="none" stroke="#32734e" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="265.0" y="754" text-anchor="middle" font-size="13" fill="#32734e">⑦ WS(S)：changed / cursor</text>
<path d="M1130,820 L640,820" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="885.0" y="809" text-anchor="middle" font-size="13" fill="#62645c">⑧ 原请求的 JSON-RPC result / error</text>
<path d="M640,875 L390,875" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="515.0" y="864" text-anchor="middle" font-size="13" fill="#62645c">返回最终 JSON / 错误</text>
<path d="M390,930 L140,930" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="265.0" y="919" text-anchor="middle" font-size="13" fill="#62645c">⑨ HTTP 200 / error</text>
<text x="40" y="1010" font-size="15" font-weight="400" fill="#62645c">此时 SDK 才 resolve / reject Promise。蓝色为请求，虚线为响应，绿色为单向事件。</text>
<text x="40" y="1042" font-size="14" font-weight="400" fill="#62645c">Agent Run 提交另走 HTTP 202 + operationId；插件 invoke 当前等待最终 HTTP 响应。</text>
<text x="40" y="1072" font-size="14" font-weight="400" fill="#62645c">会话与人工决定持久保存；插件临时进度为内存投影。手机按工作区角色访问业务 API。</text>
</svg>
