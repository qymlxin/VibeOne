<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410"><rect width="960" height="410" rx="12" fill="#fafafa"/><g font-family="system-ui,sans-serif" fill="#222"><text x="28" y="36" font-size="20" font-weight="600">插件生命周期：先受理，再执行，按身份核对</text><g fill="#fff" stroke="#aaa"><rect x="28" y="80" width="230" height="100" rx="10"/><rect x="355" y="80" width="250" height="100" rx="10"/><rect x="702" y="80" width="230" height="100" rx="10"/><rect x="28" y="265" width="230" height="100" rx="10"/><rect x="355" y="265" width="250" height="100" rx="10"/><rect x="702" y="265" width="230" height="100" rx="10"/></g><g font-size="15"><text x="45" y="110" font-weight="600">本机管理请求</text><text x="45" y="139">action / input / 幂等key</text><text x="45" y="162">POST 生命周期操作</text><text x="372" y="110" font-weight="600">Host 权限与受理</text><text x="372" y="139">SQLite保存accepted</text><text x="372" y="162">返回202 / operationId</text><text x="719" y="110" font-weight="600">独立后台任务</text><text x="719" y="139">running → succeeded / failed</text><text x="719" y="162">断开HTTP不取消</text><text x="45" y="295" font-weight="600">操作查询 / 结果详情</text><text x="45" y="324">同key找回原身份</text><text x="45" y="347">不自动重试副作用</text><text x="372" y="295" font-weight="600">既有插件服务</text><text x="372" y="324">检查 / 准备 / 发布 / 停用</text><text x="372" y="347">保留App验证与代次租约</text><text x="719" y="295" font-weight="600">主机重启</text><text x="719" y="324">未结束操作标为interrupted</text><text x="719" y="347">不自动重放</text></g><g fill="none" stroke="#666" stroke-width="2"><path d="M258 130H347m-7-5 7 5-7 5M605 130H694m-7-5 7 5-7 5M817 180V220H480V257m-5-7 5 7 5-7M355 315H266m7-5-7 5 7 5M605 315H694m-7-5 7 5-7 5"/></g><text x="28" y="395" font-size="12" fill="#555">prepare成功只表示候选已准备；App验证通过后才能另行提交commit，历史ticket仍受有效期约束。</text></g></svg>
