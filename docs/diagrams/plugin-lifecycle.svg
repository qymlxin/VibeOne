<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1080" viewBox="0 0 1380 1080" role="img" aria-labelledby="title desc">
<title id="title">插件激活、更新与排空</title><desc id="desc">先准备候选，再原子发布贡献目录；活动 Agent 会话绑定自己的版本。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#64748B" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<rect x="0" y="0" width="1380" height="1080" rx="0" fill="#F6F7FB" stroke="none"/>
<text x="40" y="43" font-size="12" font-weight="600" fill="#536174" text-anchor="start">VIBEONE  /  DESIGN SPECIFICATION</text>
<text x="40" y="88" font-size="30" font-weight="600" fill="#172033" text-anchor="start">插件激活、更新与排空</text>
<text x="40" y="119" font-size="16" font-weight="400" fill="#536174" text-anchor="start">先准备候选，再原子发布贡献目录；活动 Agent 会话绑定自己的版本。</text>
<rect x="60" y="170" width="370" height="112" rx="12" fill="white" stroke="#E2E8F0"/>
<text x="78" y="199" font-size="18" font-weight="600" fill="#172033" text-anchor="start">01  检查安装包</text>
<text x="78" y="224" font-size="14" font-weight="400" fill="#536174" text-anchor="start">身份 / 平台 / 路径 / digest</text>
<text x="78" y="247" font-size="14" font-weight="400" fill="#536174" text-anchor="start">配置 Schema / 兼容版本 / 依赖</text>
<rect x="505" y="170" width="370" height="112" rx="12" fill="#EEF2FF" stroke="#E2E8F0"/>
<text x="523" y="199" font-size="18" font-weight="600" fill="#172033" text-anchor="start">02  创建候选代</text>
<text x="523" y="224" font-size="14" font-weight="400" fill="#536174" text-anchor="start">不替换当前 active</text>
<text x="523" y="247" font-size="14" font-weight="400" fill="#536174" text-anchor="start">准备配置迁移与贡献绑定</text>
<rect x="950" y="170" width="370" height="112" rx="12" fill="white" stroke="#E2E8F0"/>
<text x="968" y="199" font-size="18" font-weight="600" fill="#172033" text-anchor="start">当前 active 继续服务</text>
<text x="968" y="224" font-size="14" font-weight="400" fill="#536174" text-anchor="start">候选失败时保持可用</text>
<text x="968" y="247" font-size="14" font-weight="400" fill="#536174" text-anchor="start">显示失败原因与重试入口</text>
<path d="M430,226 L495,226" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M487.0,222.0 L495,226 L487.0,230.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="290" y="365" width="350" height="112" rx="12" fill="white" stroke="#E2E8F0"/>
<text x="308" y="394" font-size="18" font-weight="600" fill="#172033" text-anchor="start">App / 声明式贡献</text>
<text x="308" y="419" font-size="14" font-weight="400" fill="#536174" text-anchor="start">JS 模块动态注册 / Schema 表单</text>
<text x="308" y="442" font-size="14" font-weight="400" fill="#536174" text-anchor="start">客户端维护 Registry 与 Scope</text>
<rect x="740" y="365" width="350" height="112" rx="12" fill="white" stroke="#E2E8F0"/>
<text x="758" y="394" font-size="18" font-weight="600" fill="#172033" text-anchor="start">Node / 可选 native Worker</text>
<text x="758" y="419" font-size="14" font-weight="400" fill="#536174" text-anchor="start">准备实例 → 握手 → handler 核验</text>
<text x="758" y="442" font-size="14" font-weight="400" fill="#536174" text-anchor="start">超时 / 取消 / stderr 日志</text>
<path d="M640,282 L640,325 L465,325 L465,355" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M469.0,347.0 L465,355 L461.0,347.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M740,282 L740,325 L915,325 L915,355" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M919.0,347.0 L915,355 L911.0,347.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<text x="700" y="323" font-size="14" font-weight="400" fill="#536174" text-anchor="middle">按 binding 选择</text>
<rect x="505" y="555" width="370" height="112" rx="12" fill="#EEF2FF" stroke="#E2E8F0"/>
<text x="523" y="584" font-size="18" font-weight="600" fill="#172033" text-anchor="start">03  原子发布目录</text>
<text x="523" y="609" font-size="14" font-weight="400" fill="#536174" text-anchor="start">整个 contribution 集合一起出现</text>
<text x="523" y="632" font-size="14" font-weight="400" fill="#536174" text-anchor="start">catalog revision + generation</text>
<path d="M465,477 L465,515 L610,515 L610,545" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M614.0,537.0 L610,545 L606.0,537.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M915,477 L915,515 L770,515 L770,545" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M774.0,537.0 L770,545 L766.0,537.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="60" y="760" width="370" height="112" rx="12" fill="white" stroke="#E2E8F0"/>
<text x="78" y="789" font-size="18" font-weight="600" fill="#172033" text-anchor="start">新会话与未绑定调用使用新代</text>
<text x="78" y="814" font-size="14" font-weight="400" fill="#536174" text-anchor="start">旧会话后续 Run 仍使用旧代</text>
<text x="78" y="837" font-size="14" font-weight="400" fill="#536174" text-anchor="start">禁用后拒绝新的调用</text>
<rect x="505" y="760" width="370" height="112" rx="12" fill="#FFF7ED" stroke="#E2E8F0"/>
<text x="523" y="789" font-size="18" font-weight="600" fill="#172033" text-anchor="start">旧代等待已有 lease</text>
<text x="523" y="814" font-size="14" font-weight="400" fill="#536174" text-anchor="start">短调用可限时排空</text>
<text x="523" y="837" font-size="14" font-weight="400" fill="#536174" text-anchor="start">长会话等待完成或显式停止</text>
<rect x="950" y="760" width="370" height="112" rx="12" fill="white" stroke="#E2E8F0"/>
<text x="968" y="789" font-size="18" font-weight="600" fill="#172033" text-anchor="start">04  释放旧代</text>
<text x="968" y="814" font-size="14" font-weight="400" fill="#536174" text-anchor="start">逆序清理订阅 / 注册 / 任务</text>
<text x="968" y="837" font-size="14" font-weight="400" fill="#536174" text-anchor="start">保留用户配置与历史</text>
<path d="M590,667 L590,710 L245,710 L245,750" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M249.0,742.0 L245,750 L241.0,742.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M690,667 L690,750" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M694.0,742.0 L690,750 L686.0,742.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M875,816 L940,816" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M932.0,812.0 L940,816 L932.0,820.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M1090,420 L1135,420 L1135,292" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/>
<path d="M1131.0,300.0 L1135,292 L1139.0,300.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<text x="1195" y="440" font-size="14" font-weight="400" fill="#536174" text-anchor="middle">候选失败</text>
<text x="1195" y="464" font-size="14" font-weight="400" fill="#536174" text-anchor="middle">保留旧版</text>
<rect x="60" y="915" width="1260" height="76" rx="10" fill="#EEF2FF" stroke="none"/>
<text x="76" y="943" font-size="16" font-weight="600" fill="#172033" text-anchor="start">执行与 UI 生命周期独立</text>
<text x="76" y="968" font-size="14" font-weight="400" fill="#536174" text-anchor="start">后台 Worker 留在 Host；手机加载兼容的浏览器 App 产物，不执行 Node 或原生程序。</text>
<line x1="40" y1="1037" x2="1340" y2="1037" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="40" y="1061" font-size="12" font-weight="400" fill="#536174" text-anchor="start">目标设计 · 2026-11-05 · 状态与数据均为示例</text>
<text x="1340" y="1061" font-size="12" font-weight="400" fill="#536174" text-anchor="end">plugin-lifecycle</text>
</svg>
