<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
<title id="title">插件运行结构</title><desc id="desc">JS 直接开发或 TS 编译为 JS，前端动态注册，后台与 Agent 分别由 Host 管理</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<rect width="1280" height="900" fill="#f3f3f1"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#62645c" stroke-width="1.5"/></marker></defs>
<text x="40" y="60" font-size="28" font-weight="650" fill="#252622">插件运行结构</text>
<text x="40" y="94" font-size="15" font-weight="400" fill="#62645c">JS 直接开发或 TS 编译为 JS，前端动态注册，后台与 Agent 分别由 Host 管理</text>
<rect x="40" y="150" width="300" height="120" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="58" y="182" font-size="18" font-weight="600" fill="#252622">桌面 / 手机 App Host</text>
<text x="58" y="211" font-size="14" font-weight="400" fill="#62645c">加载 JS，注册 React 组件</text>
<text x="58" y="234" font-size="14" font-weight="400" fill="#62645c">Registry / Scope / Hook / 服务</text>
<rect x="400" y="150" width="440" height="160" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="418" y="182" font-size="18" font-weight="600" fill="#252622">Rust Host 可信内核</text>
<text x="418" y="211" font-size="14" font-weight="400" fill="#62645c">设备授权、会话调度、审批提交</text>
<text x="418" y="234" font-size="14" font-weight="400" fill="#62645c">数据库事务和持久化事件</text>
<text x="418" y="257" font-size="14" font-weight="400" fill="#62645c">核心决定权不交给插件</text>
<rect x="900" y="150" width="340" height="160" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="918" y="182" font-size="18" font-weight="600" fill="#252622">插件包</text>
<text x="918" y="211" font-size="14" font-weight="400" fill="#62645c">plugin.json / dist / Schema</text>
<text x="918" y="234" font-size="14" font-weight="400" fill="#62645c">声明 App、Worker 与贡献绑定</text>
<text x="918" y="257" font-size="14" font-weight="400" fill="#62645c">安装检查不运行任意脚本</text>
<path d="M340,210 L400,210" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="400" y="380" width="440" height="160" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="418" y="412" font-size="18" font-weight="600" fill="#252622">插件管理与扩展目录</text>
<text x="418" y="441" font-size="14" font-weight="400" fill="#62645c">校验、依赖、作用域、版本路由</text>
<text x="418" y="464" font-size="14" font-weight="400" fill="#62645c">原子发布贡献，管理实例与租约</text>
<text x="418" y="487" font-size="14" font-weight="400" fill="#62645c">宿主调用再次检查权限</text>
<path d="M620,310 L620,380" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1070,310 L1070,340 L780,340 L780,380" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="900" y="380" width="340" height="160" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="918" y="412" font-size="18" font-weight="600" fill="#252622">Node / 可选原生 Worker</text>
<text x="918" y="441" font-size="14" font-weight="400" fill="#62645c">JS ESM 或 native handler</text>
<text x="918" y="464" font-size="14" font-weight="400" fill="#62645c">Node 逻辑实例按代次路由</text>
<text x="918" y="487" font-size="14" font-weight="400" fill="#62645c">stdio RPC，日志进入 stderr</text>
<path d="M840,425 L900,425" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M900,495 L840,495" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="445" font-size="16" font-weight="600" fill="#252622">App 注册、插件 RPC、ACP 分离</text>
<text x="40" y="476" font-size="14" font-weight="400" fill="#62645c">Worker 返回启动描述，Host 启动 Agent。</text>
<text x="40" y="501" font-size="14" font-weight="400" fill="#62645c">通知与界面扩展失败不阻塞审批事务。</text>
<rect x="40" y="650" width="500" height="140" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="58" y="682" font-size="18" font-weight="600" fill="#252622">Host Agent 进程监督</text>
<text x="58" y="711" font-size="14" font-weight="400" fill="#62645c">根据可信启动描述创建独立进程</text>
<text x="58" y="734" font-size="14" font-weight="400" fill="#62645c">持有 Agent stdio，处理取消与进程树清理</text>
<text x="58" y="757" font-size="14" font-weight="400" fill="#62645c">不混入插件控制协议</text>
<rect x="740" y="650" width="500" height="140" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="758" y="682" font-size="18" font-weight="600" fill="#252622">Agent / ACP 桥接程序</text>
<text x="758" y="711" font-size="14" font-weight="400" fill="#62645c">通过 ACP 收发会话、消息和工具进展</text>
<text x="758" y="734" font-size="14" font-weight="400" fill="#62645c">权限请求回到 Host 可信审批路径</text>
<text x="758" y="757" font-size="14" font-weight="400" fill="#62645c">不把自己的协议输出写入 Worker stdout</text>
<path d="M500,310 L500,340 L370,340 L370,620 L290,620 L290,650" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M540,700 L740,700" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M740,755 L540,755" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="580" y="683" font-size="14" font-weight="400" fill="#62645c">独立 ACP 通道</text>
<text x="40" y="855" font-size="15" font-weight="400" fill="#62645c">App 与后台插件均为用户信任的代码；Scope 和共享 Node 实例不等于安全沙箱。</text>
</svg>
