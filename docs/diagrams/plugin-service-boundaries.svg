<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
<title id="title">服务划分与通信协议</title><desc id="desc">桌面、手机、Rust Host、插件 Worker 与 Agent 的进程边界；当前主要功能版</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<rect width="1280" height="960" fill="#f3f3f1"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#62645c" stroke-width="1.5"/></marker></defs>
<text x="40" y="60" font-size="28" font-weight="650" fill="#252622">服务划分与通信协议</text>
<text x="40" y="94" font-size="15" font-weight="400" fill="#62645c">桌面、手机、Rust Host、插件 Worker 与 Agent 的进程边界；当前主要功能版</text>
<rect x="440" y="135" width="800" height="560" rx="8" fill="#ffffff" stroke="#d3d5cd"/>
<text x="460" y="165" font-size="17" font-weight="600" fill="#252622">同一个 Rust Host 进程，不拆成网络微服务</text>
<rect x="40" y="165" width="300" height="140" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="58" y="197" font-size="18" font-weight="600" fill="#252622">桌面端：Tauri WebView</text>
<text x="58" y="226" font-size="14" font-weight="400" fill="#62645c">React / App 插件 / SDK</text>
<text x="58" y="249" font-size="14" font-weight="400" fill="#62645c">Registry 为本地同步注册</text>
<text x="58" y="272" font-size="14" font-weight="400" fill="#62645c">后台调用返回 Promise</text>
<rect x="40" y="340" width="300" height="90" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="58" y="372" font-size="18" font-weight="600" fill="#252622">Tauri 原生壳</text>
<text x="58" y="401" font-size="14" font-weight="400" fill="#62645c">目录选择、托盘、系统通知</text>
<path d="M190,305 L190,340" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="207" y="327" font-size="12" font-weight="400" fill="#62645c">IPC：invoke / Promise</text>
<rect x="40" y="470" width="300" height="140" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="58" y="502" font-size="18" font-weight="600" fill="#252622">手机端：浏览器</text>
<text x="58" y="531" font-size="14" font-weight="400" fill="#62645c">React 移动工作台</text>
<text x="58" y="554" font-size="14" font-weight="400" fill="#62645c">不运行 Node / native / App ESM</text>
<text x="58" y="577" font-size="14" font-weight="400" fill="#62645c">HTTPS/WSS · Promise</text>
<rect x="480" y="190" width="700" height="100" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="498" y="222" font-size="18" font-weight="600" fill="#252622">API 与事件网关</text>
<text x="498" y="251" font-size="14" font-weight="400" fill="#62645c">命令与查询：HTTP(S)；事件订阅与推送：WS(S)</text>
<rect x="480" y="340" width="330" height="135" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="498" y="372" font-size="18" font-weight="600" fill="#252622">插件调度模块</text>
<text x="498" y="401" font-size="14" font-weight="400" fill="#62645c">贡献目录、实例、代次和路由</text>
<text x="498" y="424" font-size="14" font-weight="400" fill="#62645c">持久化插件目录，管理 Worker</text>
<text x="498" y="447" font-size="14" font-weight="400" fill="#62645c">Rust 内部 async fn / 事件通道</text>
<rect x="850" y="340" width="330" height="135" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="868" y="372" font-size="18" font-weight="600" fill="#252622">核心业务与 Agent 接入</text>
<text x="868" y="401" font-size="14" font-weight="400" fill="#62645c">鉴权、工作区、审批、会话</text>
<text x="868" y="424" font-size="14" font-weight="400" fill="#62645c">反向宿主调用与 Agent 监督</text>
<text x="868" y="447" font-size="14" font-weight="400" fill="#62645c">Rust 内部 async fn</text>
<rect x="850" y="530" width="330" height="110" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="868" y="562" font-size="18" font-weight="600" fill="#252622">SQLite：Host 内嵌存储</text>
<text x="868" y="591" font-size="14" font-weight="400" fill="#62645c">操作 / 回执 / 事件 / 业务状态</text>
<text x="868" y="614" font-size="14" font-weight="400" fill="#62645c">库调用，不是独立网络服务</text>
<rect x="480" y="735" width="330" height="115" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="498" y="767" font-size="18" font-weight="600" fill="#252622">后台插件 Worker</text>
<text x="498" y="796" font-size="14" font-weight="400" fill="#62645c">Node.js 独立进程</text>
<text x="498" y="819" font-size="14" font-weight="400" fill="#62645c">运行 handler，响应或报告进度</text>
<text x="498" y="842" font-size="14" font-weight="400" fill="#62645c">本版按候选代次启动 Runner</text>
<rect x="850" y="735" width="330" height="115" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="868" y="767" font-size="18" font-weight="600" fill="#252622">Agent / ACP 桥接程序</text>
<text x="868" y="796" font-size="14" font-weight="400" fill="#62645c">独立进程，执行 Coding Agent</text>
<text x="868" y="819" font-size="14" font-weight="400" fill="#62645c">请求受理、更新通知与权限请求</text>
<text x="868" y="842" font-size="14" font-weight="400" fill="#62645c">不经过 App 插件或 Worker 中转</text>
<path d="M340,225 L480,225" fill="none" stroke="#486778" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480,260 L340,260" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="347" y="211" font-size="12" font-weight="400" fill="#62645c">HTTP / WS</text>
<path d="M340,535 L395,535 L395,275 L480,275" fill="none" stroke="#486778" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480,285 L415,285 L415,575 L340,575" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<path d="M645,290 L645,340" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1015,290 L1015,340" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M810,395 L850,395" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M850,440 L810,440" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<path d="M1015,475 L1015,530" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1055,530 L1055,475" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="1070" y="511" font-size="12" font-weight="400" fill="#62645c">SQLx await</text>
<path d="M645,475 L645,735" fill="none" stroke="#486778" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M690,735 L690,475" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="710" y="588" font-size="13" font-weight="400" fill="#62645c">stdio JSON-RPC</text>
<text x="710" y="613" font-size="12" font-weight="400" fill="#62645c">请求 / 响应 / 通知</text>
<path d="M1180,395 L1200,395 L1200,715 L1015,715 L1015,735" fill="none" stroke="#486778" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1065,735 L1065,700 L1215,700 L1215,440 L1180,440" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="895" y="675" font-size="13" font-weight="400" fill="#62645c">stdio ACP v2：请求受理 + 更新通知</text>
<text x="40" y="900" font-size="15" font-weight="400" fill="#62645c">跨端调用均为异步 I/O；await 只等待结果，不表示阻塞整个界面或 Host。</text>
<text x="40" y="931" font-size="14" font-weight="400" fill="#62645c">手机经可信 HTTPS/WSS 入口访问，可由前置 TLS 代理转发；桌面首版统一走 loopback HTTP/WS。</text>
</svg>
