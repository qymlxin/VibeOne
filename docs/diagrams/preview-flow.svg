<svg xmlns="http://www.w3.org/2000/svg" width="960" height="370" viewBox="0 0 960 370"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#666"/></marker></defs><rect width="960" height="370" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#252525"><text x="25" y="32" font-size="20" font-weight="600">对话链接如何进入右侧预览</text><g fill="#f5f5f5" stroke="#bbb"><rect x="25" y="143" width="150" height="70" rx="10"/><rect x="245" y="61" width="205" height="78" rx="10"/><rect x="245" y="227" width="205" height="78" rx="10"/><rect x="525" y="61" width="185" height="78" rx="10"/><rect x="525" y="227" width="185" height="78" rx="10"/><rect x="780" y="61" width="155" height="78" rx="10"/><rect x="780" y="227" width="155" height="78" rx="10"/></g><g font-size="14"><text x="48" y="174">点击消息 / 工具链接</text><text x="48" y="196" font-size="11" fill="#666">中间对话保持可读</text><text x="263" y="91">HTTP(S) 网址校验</text><text x="263" y="116" font-size="11" fill="#666">拒绝其他协议与内嵌凭据</text><text x="263" y="257">解析为当前工作区路径</text><text x="263" y="282" font-size="11" fill="#666">拒绝越界、编码穿越与其他主机</text><text x="543" y="91">隔离 iframe 独立加载</text><text x="543" y="116" font-size="11" fill="#666">无 IPC / 顶层导航权限</text><text x="543" y="257">Host 文件 API 异步读取</text><text x="543" y="282" font-size="11" fill="#666">再次校验路径与设备工作区范围</text><text x="796" y="91">侧边网页预览</text><text x="796" y="116" font-size="11" fill="#666">不兼容时外部打开</text><text x="796" y="257">只读文件 / 差异</text><text x="796" y="282" font-size="11" fill="#666">不执行文件内容</text></g><g fill="none" stroke="#666" marker-end="url(#arrow)"><path d="M175 161L245 100"/><path d="M175 194L245 266"/><path d="M450 100H525"/><path d="M450 266H525"/><path d="M710 100H780"/><path d="M710 266H780"/></g><text x="25" y="345" fill="#666" font-size="12">网址不通过 Host 代理抓取；本机外部打开也单独校验 URL。加载事件不等于网页内容可正常显示。</text></g></svg>
