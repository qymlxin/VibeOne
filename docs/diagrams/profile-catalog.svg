<g font-size="13" fill="#4a5565"><text x="48" y="147">SQLite 保存 JSON</text><text x="48" y="170">本地读取不改写旧配置</text><text x="48" y="193">未知扩展继续保留</text><text x="383" y="147">目录身份与记录身份一致</text><text x="383" y="170">旧记录没有修订时不补造</text><text x="383" y="193">格式异常不进入可用配置</text><text x="738" y="147">固定参数、修订及插件代次</text><text x="738" y="170">修改目录不改变已有会话</text><text x="738" y="193">移除目录后仍保留历史配置</text><text x="48" y="347">原始内容仍保留在本地</text><text x="48" y="370">由用户明确点击移除</text><text x="48" y="393">携带身份、修订及记录摘要</text><text x="383" y="347">现有权限校验保持不变</text><text x="383" y="370">摘要绑定当前原始内容</text><text x="383" y="393">即使修订没变也检测内容变化</text><text x="738" y="347">同一记录 → 删除该目录记录</text><text x="738" y="370">记录已变化 → 拒绝，重新加载</text><text x="738" y="393">已有会话和工程文件保持不变</text></g>
