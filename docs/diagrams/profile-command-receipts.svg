<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
<title id="title">Agent 配置写操作对账</title><desc id="desc">设置页通过HTTP同步提交稳定key。Host检查Owner权限，在串行门内查回执；重复请求返回历史结果，首次请求校验修订后在单事务提交配置、事件及回执。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1040" height="420" fill="#fff" rx="12"/>
<g font-family="system-ui,sans-serif" fill="#1a1c1f"><text x="30" y="40" font-size="22" font-weight="600">配置写入与回执：同事务提交，重复请求不重做</text>
<g fill="#f5f5f5" stroke="#d4d4d4"><rect x="30" y="110" width="210" height="105" rx="10"/><rect x="310" y="110" width="260" height="105" rx="10"/><rect x="650" y="75" width="350" height="90" rx="10"/><rect x="650" y="240" width="350" height="105" rx="10"/></g>
<g font-size="17" font-weight="600"><text x="50" y="143">设置页：Agent 配置</text><text x="330" y="143">Host：Owner 权限检查</text><text x="670" y="108">命中成功回执</text><text x="670" y="273">首次：校验 revision / recordHash</text></g>
<g font-size="15"><text x="50" y="172">新建 / 修订 / 移除</text><text x="50" y="198">结果未知时保留 key</text><text x="330" y="172">目录串行门 → 查键与指纹</text><text x="330" y="198">同键不同参数：409 冲突</text><text x="670" y="138">返回原结果；不重建、不升级、不恢复</text><text x="670" y="302">SQLite：配置 + 事件 + 私有回执</text><text x="670" y="329">任一失败全部回滚，成功才发布</text></g>
<g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"><path d="M240 160H310"/><path d="M570 140H610V120H650"/><path d="M570 190H610V290H650"/><path d="M820 345V375H135V215"/></g>
<g font-size="13" fill="#525252"><text x="246" y="145">HTTP</text><text x="586" y="105">重复</text><text x="580" y="264">首次</text><text x="300" y="400">同步返回原成功结构；响应丢失后由用户同键重试，不自动重放</text></g>
</g></svg>
