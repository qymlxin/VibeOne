<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500"><rect width="1040" height="500" rx="18" fill="#181818"/><g font-family="system-ui,sans-serif" fill="#eee"><text x="30" y="39" font-size="22">项目空间 · 对话与协作</text><g fill="#262626" stroke="#505050"><rect x="30" y="75" width="285" height="330" rx="12"/><rect x="375" y="75" width="285" height="330" rx="12"/><rect x="720" y="75" width="290" height="330" rx="12"/></g><g font-size="17"><text x="50" y="108">Electron / React 工作台</text><text x="395" y="108">Rust Host · 持久化与调度</text><text x="740" y="108">各个 Agent 工具</text></g><g font-size="14" fill="#bbb"><text x="50" y="150">首页：全部项目、对话与看板</text><text x="50" y="188">项目空间：固定管家</text><text x="50" y="218">命名 Agent · 角色与预设</text><text x="50" y="248">会话组：多人共享一个对话 ID</text><text x="50" y="278">显示分组：仅管理列表位置</text><text x="50" y="333">右侧：代码 / 变更 / PTY 终端</text><text x="50" y="363">Chromium 独立网页预览</text><text x="395" y="150">HTTP 接收 → 先保存再调度</text><text x="395" y="188">每个成员独立上游上下文</text><text x="395" y="218">逐个执行 · 结果回到共享对话</text><text x="395" y="248">结构化转交 → 校验当前组员</text><text x="395" y="278">每轮最多 8 次成员执行</text><text x="395" y="333">审批 / 输入继续由用户处理</text><text x="395" y="363">重启标记中断，不自动重放</text><text x="740" y="150">ACP v2 · JSON-RPC</text><text x="740" y="188">Codex / Claude / 插件工具</text><text x="740" y="218">消息、思考摘要、工具与审批</text><text x="740" y="248">异步推送，持续回传执行过程</text><text x="740" y="333">共享项目目录，沿用写入排他锁</text><text x="740" y="363">组内上下文与私人对话隔离</text></g></g><g stroke="#9ab6ff" stroke-width="2" fill="none"><path d="M325 150h40m-8-5 8 5-8 5M670 150h40m-8-5 8 5-8 5M710 290h-40m8-5-8 5 8 5M365 290h-40m8-5-8 5 8 5"/></g><text x="30" y="454" fill="#aaa" font-family="system-ui,sans-serif" font-size="14">HTTP 立即返回已受理状态；后台异步执行。对话与事件通过现有 WebSocket 同步，协作状态按需刷新。</text></svg>
