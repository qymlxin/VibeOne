<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" rx="12" fill="#fafafa"/><g font-family="system-ui,sans-serif" fill="#222" font-size="14"><text x="28" y="35" font-size="19" font-weight="600">环境探测：协议握手与 CLI 登录状态分开验证</text><g fill="#fff" stroke="#aaa"><rect x="28" y="80" width="190" height="78" rx="8"/><rect x="290" y="80" width="310" height="78" rx="8"/><rect x="680" y="80" width="290" height="78" rx="8"/><rect x="290" y="225" width="310" height="78" rx="8"/><rect x="680" y="225" width="290" height="78" rx="8"/></g><text x="44" y="108">设置页：检查环境</text><text x="44" y="135">HTTP 异步等待结果</text><text x="306" y="108">Host：管理权限 / 保存配置 / 单实例</text><text x="306" y="135">官方 SDK → ACP v2 initialize</text><text x="696" y="108">Agent 本机进程</text><text x="696" y="135">名称 / 版本 / 能力；最长 10 秒</text><text x="306" y="253">CLI 只读登录状态（最长 4 秒）</text><text x="306" y="280">仅默认内置入口；原始输出丢弃</text><text x="696" y="253">返回归一化状态与登录引导</text><text x="696" y="280">已登录 / 未登录 / 未确认</text><path d="M218 120H286M600 120H676M445 158V221M600 263H676M825 225V162" stroke="#666" stroke-width="2" fill="none"/><text x="28" y="338" font-size="12" fill="#666">不创建会话、不发送任务、不自动批准或提交凭据；初始化超时释放进程；失败保留表单，切换配置清空旧结果。</text></g></svg>
