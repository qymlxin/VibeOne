<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330">
 <rect width="920" height="330" rx="12" fill="#fafafa"/>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#666"/></marker></defs>
 <g font-family="system-ui,sans-serif" fill="#222">
  <text x="30" y="35" font-size="21" font-weight="600">存储读取失败后，仍可查看缓存状态</text>
  <text x="30" y="62" font-size="13" fill="#666">只读 GET 同步请求；两次查询都保留鉴权和工作区范围过滤，不重试任何写操作。</text>
  <g fill="white" stroke="#aaa">
   <rect x="30" y="100" width="190" height="70" rx="8"/><rect x="275" y="100" width="230" height="70" rx="8"/><rect x="560" y="100" width="330" height="70" rx="8"/>
   <rect x="30" y="220" width="190" height="70" rx="8"/><rect x="275" y="220" width="230" height="70" rx="8"/><rect x="560" y="220" width="330" height="70" rx="8"/>
  </g>
  <g font-size="14">
   <text x="48" y="128">客户端 GET /sync</text><text x="48" y="152">携带可信 epoch / 游标</text>
   <text x="293" y="128">Host：一致性门闩内查询</text><text x="293" y="152">SQLite 读取变化会话 ID</text>
   <text x="578" y="128">读取失败 → 标记不可写并发出 WS 通知</text><text x="578" y="152">HTTP 503 / STORAGE_UNAVAILABLE</text>
   <text x="48" y="248">下一次 GET /sync</text><text x="48" y="272">继续使用原可信基线</text>
   <text x="293" y="248">Host：已知存储故障</text><text x="293" y="272">使用缓存，不再读取 SQLite</text>
   <text x="578" y="248">HTTP 200：reset = storage + 授权快照</text><text x="578" y="272">继续显示故障；新写命令仍拒绝</text>
  </g>
  <g fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)">
   <path d="M220 135H272"/><path d="M505 135H557"/><path d="M220 255H272"/><path d="M505 255H557"/>
  </g>
  <text x="30" y="317" font-size="12" fill="#666">错误、快照及会话状态使用固定故障说明；缓存可读不等于数据库已恢复，也不能证明外部副作用回滚。</text>
 </g>
</svg>
