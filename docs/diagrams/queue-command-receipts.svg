<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-labelledby="title desc">
<title id="title">队列控制与回执对账</title><desc id="desc">客户端稳定key同步请求Host，Host权限检查和串行门内查回执，重复请求返回历史成功，首次请求校验状态并原子提交队列和回执，再异步唤醒执行驱动，进度通过Host同步回客户端。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#64748b"/></marker></defs><rect width="1040" height="440" rx="12" fill="#fff"/>
<g font-family="system-ui,sans-serif" fill="#1a1c1f"><text x="30" y="40" font-size="22" font-weight="600">队列控制：重试返回原受理，不重做旧动作</text>
<g fill="#f5f5f5" stroke="#d4d4d4"><rect x="30" y="100" width="210" height="105" rx="10"/><rect x="310" y="100" width="280" height="105" rx="10"/><rect x="670" y="70" width="340" height="80" rx="10"/><rect x="670" y="225" width="340" height="110" rx="10"/><rect x="310" y="300" width="280" height="100" rx="10"/></g>
<g font-size="17" font-weight="600"><text x="50" y="133">桌面 / 手机队列控件</text><text x="330" y="133">Host：权限 → 会话串行门</text><text x="690" y="103">命中回执：返回原成功</text><text x="690" y="258">首次：状态 / 上下文校验</text><text x="330" y="333">Host 执行驱动</text></g>
<g font-size="15"><text x="50" y="163">暂停 / 继续 / 撤回 + key</text><text x="50" y="190">失败保留原请求，手动重试</text><text x="330" y="163">先查键与参数指纹</text><text x="330" y="190">同键不同内容：409</text><text x="690" y="130">不重新改变队列或启动驱动</text><text x="690" y="288">SQLite：队列 + 事件 + 回执</text><text x="690" y="316">同步受理 updated，不等待Agent</text><text x="330" y="363">受理后按原队列规则异步执行</text><text x="330" y="388">进度通过WS / 游标同步回传</text></g>
<g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"><path d="M240 150H310"/><path d="M590 125H630V110H670"/><path d="M590 175H630V280H670"/><path d="M670 320H590"/><path d="M310 355H135V205"/></g>
<g font-size="13" fill="#525252"><text x="247" y="135">HTTP</text><text x="601" y="95">重复</text><text x="601" y="251">首次</text><text x="599" y="309">唤醒</text><text x="38" y="329">Host 状态同步</text><text x="310" y="427">重启保留回执；新执行仍需满足队列暂停与上下文确认规则</text></g></g></svg>
