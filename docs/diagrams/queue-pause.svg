<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350"><rect width="900" height="350" rx="12" fill="#fafafa"/><g font-family="system-ui,sans-serif" fill="#222" font-size="14"><text x="28" y="36" font-size="19" font-weight="600">手动暂停：当前执行继续，下一轮等待恢复</text><g fill="#fff" stroke="#aaa"><rect x="28" y="88" width="180" height="65" rx="8"/><rect x="270" y="88" width="265" height="65" rx="8"/><rect x="595" y="88" width="275" height="65" rx="8"/><rect x="270" y="233" width="265" height="65" rx="8"/><rect x="595" y="233" width="275" height="65" rx="8"/></g><text x="44" y="115">桌面 / 手机 operator</text><text x="44" y="139">点击暂停队列</text><text x="286" y="115">Host 持有会话 gate</text><text x="286" y="139">持久提交 queuePaused = true</text><text x="611" y="115">当前 Agent Run 继续异步执行</text><text x="611" y="139">正常完成后不提升下一条消息</text><text x="286" y="261">用户恢复 → Host 清除暂停</text><text x="286" y="285">提交状态后唤醒队列驱动</text><text x="611" y="261">驱动检查：无当前执行、未暂停</text><text x="611" y="285">下一条进入 ACP，仍然串行</text><path d="M208 120H266M535 120H591M730 153V199H403V229M535 266H591" fill="none" stroke="#666" stroke-width="2"/><text x="30" y="328" fill="#666" font-size="12">HTTP 提交返回本地回执；WebSocket 通知状态变化；暂停不发送 Agent 取消指令，不自动审批。</text></g></svg>
