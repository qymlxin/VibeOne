<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1030" viewBox="0 0 1320 1030" role="img" aria-labelledby="title desc">
<title id="title">断线恢复与事件连续性</title><desc id="desc">客户端恢复可信状态后再开放操作；离线草稿与已提交命令分开处理。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#64748B" stroke-width="1.5"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style>
<rect x="0" y="0" width="1320" height="1030" rx="0" fill="#F6F7FB" stroke="none"/>
<text x="40" y="43" font-size="12" font-weight="600" fill="#536174" text-anchor="start">VIBEONE  /  DESIGN SPECIFICATION</text>
<text x="40" y="88" font-size="30" font-weight="600" fill="#172033" text-anchor="start">断线恢复与事件连续性</text>
<text x="40" y="119" font-size="16" font-weight="400" fill="#536174" text-anchor="start">客户端恢复可信状态后再开放操作；离线草稿与已提交命令分开处理。</text>
<rect x="60" y="175" width="340" height="110" rx="12" fill="white" stroke="#E2E8F0"/>
<text x="78" y="204" font-size="18" font-weight="600" fill="#172033" text-anchor="start">连接断开</text>
<text x="78" y="229" font-size="14" font-weight="400" fill="#536174" text-anchor="start">保留只读快照与草稿</text>
<text x="78" y="252" font-size="14" font-weight="400" fill="#536174" text-anchor="start">显示最后同步时间，禁用写操作</text>
<rect x="490" y="175" width="340" height="110" rx="12" fill="white" stroke="#E2E8F0"/>
<text x="508" y="204" font-size="18" font-weight="600" fill="#172033" text-anchor="start">认证重连</text>
<text x="508" y="229" font-size="14" font-weight="400" fill="#536174" text-anchor="start">host_id / epoch / cursor</text>
<text x="508" y="252" font-size="14" font-weight="400" fill="#536174" text-anchor="start">验证设备、角色与工作区范围</text>
<rect x="920" y="175" width="340" height="110" rx="12" fill="#FFF7ED" stroke="#E2E8F0"/>
<text x="938" y="204" font-size="18" font-weight="600" fill="#172033" text-anchor="start">设备已撤销</text>
<text x="938" y="229" font-size="14" font-weight="400" fill="#536174" text-anchor="start">关闭连接，清除敏感缓存</text>
<text x="938" y="252" font-size="14" font-weight="400" fill="#536174" text-anchor="start">回到配对入口</text>
<path d="M400,230 L480,230" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M472.0,226.0 L480,230 L472.0,234.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M830,230 L910,230" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M902.0,226.0 L910,230 L902.0,234.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<text x="874" y="212" font-size="13" font-weight="400" fill="#536174" text-anchor="middle">拒绝</text>
<rect x="60" y="405" width="340" height="110" rx="12" fill="white" stroke="#E2E8F0"/>
<text x="78" y="434" font-size="18" font-weight="600" fill="#172033" text-anchor="start">cursor 有效</text>
<text x="78" y="459" font-size="14" font-weight="400" fill="#536174" text-anchor="start">按授权续传后续事件</text>
<text x="78" y="482" font-size="14" font-weight="400" fill="#536174" text-anchor="start">event_id 去重 / 检测缺口</text>
<rect x="490" y="405" width="340" height="110" rx="12" fill="#EEF2FF" stroke="#E2E8F0"/>
<text x="508" y="434" font-size="18" font-weight="600" fill="#172033" text-anchor="start">cursor 过期</text>
<text x="508" y="459" font-size="14" font-weight="400" fill="#536174" text-anchor="start">一致性快照 + high-water mark</text>
<text x="508" y="482" font-size="14" font-weight="400" fill="#536174" text-anchor="start">切换到边界之后的事件</text>
<rect x="920" y="405" width="340" height="110" rx="12" fill="white" stroke="#E2E8F0"/>
<text x="938" y="434" font-size="18" font-weight="600" fill="#172033" text-anchor="start">epoch 已改变</text>
<text x="938" y="459" font-size="14" font-weight="400" fill="#536174" text-anchor="start">重新读取 Run 与审批状态</text>
<text x="938" y="482" font-size="14" font-weight="400" fill="#536174" text-anchor="start">清除旧 pending 临时回执</text>
<path d="M660,285 L660,340 L230,340 L230,395" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M234.0,387.0 L230,395 L226.0,387.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
