<path d="M664.0,387.0 L660,395 L656.0,387.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M660,285 L660,340 L1090,340 L1090,395" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M1094.0,387.0 L1090,395 L1086.0,387.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="490" y="635" width="340" height="110" rx="12" fill="#EEF2FF" stroke="#E2E8F0"/>
<text x="508" y="664" font-size="18" font-weight="600" fill="#172033" text-anchor="start">应用客户端投影</text>
<text x="508" y="689" font-size="14" font-weight="400" fill="#536174" text-anchor="start">快照切换与事件消费连续</text>
<text x="508" y="712" font-size="14" font-weight="400" fill="#536174" text-anchor="start">检查在途命令回执，不重复创建</text>
<path d="M230,515 L230,565 L660,565 L660,625" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M664.0,617.0 L660,625 L656.0,617.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M660,515 L660,565 L660,565 L660,625" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M664.0,617.0 L660,625 L656.0,617.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M1090,515 L1090,565 L660,565 L660,625" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M664.0,617.0 L660,625 L656.0,617.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="490" y="815" width="340" height="100" rx="12" fill="white" stroke="#E2E8F0"/>
<text x="508" y="844" font-size="18" font-weight="600" fill="#172033" text-anchor="start">恢复可操作界面</text>
<text x="508" y="869" font-size="14" font-weight="400" fill="#536174" text-anchor="start">当前状态可信且在线</text>
<text x="508" y="892" font-size="14" font-weight="400" fill="#536174" text-anchor="start">审批必须重新校验有效性</text>
<path d="M660,745 L660,805" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M664.0,797.0 L660,805 L656.0,797.0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="60" y="815" width="340" height="76" rx="10" fill="#EEF2FF" stroke="none"/>
<text x="76" y="843" font-size="16" font-weight="600" fill="#172033" text-anchor="start">在途命令</text>
<text x="76" y="868" font-size="14" font-weight="400" fill="#536174" text-anchor="start">先查回执，再决定是否重试。</text>
<rect x="920" y="815" width="340" height="76" rx="10" fill="#EEF2FF" stroke="none"/>
<text x="936" y="843" font-size="16" font-weight="600" fill="#172033" text-anchor="start">连续性保护</text>
<text x="936" y="868" font-size="14" font-weight="400" fill="#536174" text-anchor="start">切流漏事件时立即重新同步。</text>
<line x1="40" y1="987" x2="1280" y2="987" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="40" y="1011" font-size="12" font-weight="400" fill="#536174" text-anchor="start">目标设计 · 2026-11-05 · 状态与数据均为示例</text>
<text x="1280" y="1011" font-size="12" font-weight="400" fill="#536174" text-anchor="end">reconnect-flow</text>
</svg>
