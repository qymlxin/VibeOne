<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" rx="12" fill="#fafafa"/><g font-family="system-ui,sans-serif" fill="#222"><text x="30" y="38" font-size="20" font-weight="600">远程连接：保存意图与实际运行分开</text><g fill="#fff" stroke="#aaa"><rect x="30" y="85" width="240" height="100" rx="10"/><rect x="360" y="85" width="240" height="100" rx="10"/><rect x="690" y="85" width="240" height="100" rx="10"/><rect x="30" y="270" width="240" height="100" rx="10"/><rect x="360" y="270" width="240" height="100" rx="10"/><rect x="690" y="270" width="240" height="100" rx="10"/></g><g font-size="15"><text x="48" y="115" font-weight="600">设置页编辑 IP / 端口</text><text x="48" y="143">草稿留在页面</text><text x="48" y="166">轮询不覆盖未提交输入</text><text x="378" y="115" font-weight="600">Host 启停 /remote</text><text x="378" y="143">同一状态锁串行处理</text><text x="378" y="166">失败明确返回错误</text><text x="708" y="115" font-weight="600">SQLite 保存 configuration</text><text x="708" y="143">关闭只改变 enabled</text><text x="708" y="166">IP 与端口 0 意图保留</text><text x="48" y="300" font-weight="600">页面回显</text><text x="48" y="328">实际 IP / 保存端口</text><text x="48" y="351">确认保存后更新输入</text><text x="378" y="300" font-weight="600">查询 /devices</text><text x="378" y="328">configuration：确认配置</text><text x="378" y="351">url：真实监听地址或 null</text><text x="708" y="300" font-weight="600">内存 HTTPS 监听</text><text x="708" y="328">端口 0 分配实际端口</text><text x="708" y="351">保存失败停止候选监听</text></g><g fill="none" stroke="#666" stroke-width="2"><path d="M270 128H352m-7-5 7 5-7 5M600 128H682m-7-5 7 5-7 5M480 185V262m-5-7 5 7 5-7M480 270V225H810V262m-5-7 5 7 5-7M690 320H608m7-5-7 5 7 5M360 320H278m7-5-7 5 7 5M810 185V263"/></g><g font-size="12" fill="#555"><text x="282" y="113">HTTP 异步</text><text x="613" y="113">持久确认</text><text x="30" y="402">配置已保存为开启 ≠ 当前正在监听；保存失败不能显示为持久成功。</text></g></g></svg>
