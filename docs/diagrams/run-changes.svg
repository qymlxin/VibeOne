<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340"><rect width="920" height="340" fill="#181818"/><g font-family="system-ui,sans-serif" font-size="15" fill="#eee"><text x="30" y="38" font-size="20">原始输入与两种变更范围</text><g stroke="#555" fill="#262626"><rect x="30" y="70" width="170" height="58" rx="10"/><rect x="280" y="70" width="250" height="58" rx="10"/><rect x="610" y="70" width="270" height="58" rx="10"/><rect x="30" y="185" width="170" height="65" rx="10"/><rect x="280" y="185" width="250" height="65" rx="10"/><rect x="610" y="185" width="270" height="65" rx="10"/></g><text x="48" y="104">用户原始输入</text><text x="300" y="104">Run 保存输入 → 消息气泡</text><text x="630" y="104">附加角色与引用 → ACP Agent</text><text x="48" y="214">执行前文件快照</text><text x="300" y="214">执行后比较 → 保存本轮差异</text><text x="630" y="214">回答下方入口 → 右侧独立标签</text><text x="30" y="300" fill="#aaa">右侧“工作区整体变更”：独立查询 Git 当前状态 → 变更插件，不归属某轮回答。</text></g><g stroke="#9ab6ff" stroke-width="2" fill="none"><path d="M200 99h70m-8-5 8 5-8 5M530 99h70m-8-5 8 5-8 5M200 218h70m-8-5 8 5-8 5M530 218h70m-8-5 8 5-8 5"/></g></svg>
