<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
<title id="title">执行与下一轮队列</title><desc id="desc">同一会话串行受理输入，执行阶段与人工待办分别记录</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<rect width="1280" height="960" fill="#f3f3f1"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#62645c" stroke-width="1.5"/></marker></defs>
<text x="40" y="60" font-size="28" font-weight="650" fill="#252622">执行与下一轮队列</text>
<text x="40" y="94" font-size="15" font-weight="400" fill="#62645c">同一会话串行受理输入，执行阶段与人工待办分别记录</text>
<rect x="40" y="145" width="340" height="110" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="58" y="177" font-size="18" font-weight="600" fill="#252622">设备本地草稿</text>
<text x="58" y="206" font-size="14" font-weight="400" fill="#62645c">尚未被主机受理。</text>
<text x="58" y="229" font-size="14" font-weight="400" fill="#62645c">离线编辑仍然只是草稿。</text>
<rect x="470" y="145" width="340" height="110" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="488" y="177" font-size="18" font-weight="600" fill="#252622">主机受理输入</text>
<text x="488" y="206" font-size="14" font-weight="400" fill="#62645c">校验权限范围与幂等性。</text>
<text x="488" y="229" font-size="14" font-weight="400" fill="#62645c">返回持久化的命令回执。</text>
<path d="M380,200 L470,200" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="900" y="145" width="340" height="110" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="918" y="177" font-size="18" font-weight="600" fill="#252622">会话已有活动执行</text>
<text x="918" y="206" font-size="14" font-weight="400" fill="#62645c">创建下一轮队列消息。</text>
<text x="918" y="229" font-size="14" font-weight="400" fill="#62645c">不注入当前执行轮次。</text>
<path d="M810,200 L900,200" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="824" y="187" font-size="13" font-weight="400" fill="#62645c">忙碌</text>
<rect x="470" y="340" width="340" height="110" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="488" y="372" font-size="18" font-weight="600" fill="#252622">执行：排队 / 启动中</text>
<text x="488" y="401" font-size="14" font-weight="400" fill="#62645c">获取工作区写入租约。</text>
<text x="488" y="424" font-size="14" font-weight="400" fill="#62645c">建立经过验证的 Agent 连接。</text>
<path d="M640,255 L640,340" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="654" y="299" font-size="13" font-weight="400" fill="#62645c">空闲</text>
<rect x="40" y="525" width="340" height="110" rx="6" fill="#faf5e9" stroke="#e7d8b8"/>
<text x="58" y="557" font-size="18" font-weight="600" fill="#252622">待处理请求</text>
<text x="58" y="586" font-size="14" font-weight="400" fill="#62645c">权限审批或补充信息请求。</text>
<text x="58" y="609" font-size="14" font-weight="400" fill="#62645c">提交决定不代表工具执行成功。</text>
<rect x="470" y="525" width="340" height="110" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="488" y="557" font-size="18" font-weight="600" fill="#252622">执行：运行中</text>
<text x="488" y="586" font-size="14" font-weight="400" fill="#62645c">接收流式进展与工具执行更新。</text>
<text x="488" y="609" font-size="14" font-weight="400" fill="#62645c">人工待办单独展示。</text>
<path d="M640,450 L640,525" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M470,554 L380,554" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M380,607 L470,607" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="900" y="525" width="340" height="110" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="918" y="557" font-size="18" font-weight="600" fill="#252622">执行：取消中</text>
<text x="918" y="586" font-size="14" font-weight="400" fill="#62645c">向待决请求返回取消结果。</text>
<text x="918" y="609" font-size="14" font-weight="400" fill="#62645c">等待实际终态，并监督进程退出。</text>
<path d="M810,580 L900,580" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="760" width="340" height="110" rx="6" fill="#eff6f0" stroke="#d2e4d6"/>
<text x="58" y="792" font-size="18" font-weight="600" fill="#252622">正常完成</text>
<text x="58" y="821" font-size="14" font-weight="400" fill="#62645c">可以提升下一条队列消息。</text>
<text x="58" y="844" font-size="14" font-weight="400" fill="#62645c">重新检查权限与资源。</text>
<rect x="470" y="760" width="340" height="110" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="488" y="792" font-size="18" font-weight="600" fill="#252622">失败 / 中断</text>
<text x="488" y="821" font-size="14" font-weight="400" fill="#62645c">暂停下一轮队列。</text>
<text x="488" y="844" font-size="14" font-weight="400" fill="#62645c">等待用户显式恢复。</text>
<rect x="900" y="760" width="340" height="110" rx="6" fill="#ffffff" stroke="#d3d5cd"/>
<text x="918" y="792" font-size="18" font-weight="600" fill="#252622">取消，或结束结果先到</text>
<text x="918" y="821" font-size="14" font-weight="400" fill="#62645c">保留实际观察到的终态。</text>
<text x="918" y="844" font-size="14" font-weight="400" fill="#62645c">受理取消时暂停待执行输入。</text>
<path d="M550,635 L550,690 L210,690 L210,760" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M640,635 L640,760" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1070,635 L1070,760" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1070,255 L1070,300 L855,300 L855,395 L810,395" fill="none" stroke="#62645c" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/>
<text x="900" y="332" font-size="13" font-weight="400" fill="#62645c">仅在安全的轮次切换点提升</text>
<text x="40" y="922" font-size="15" font-weight="400" fill="#62645c">撤回与提升采用原子竞争。每个会话最多一个活动执行；工作区租约同时限制并发写入。</text>
</svg>
