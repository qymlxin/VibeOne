<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">会话创建与重复提交对账</title><desc id="desc">客户端携带稳定幂等键，同步 HTTP 请求进入 Host 权限检查和串行门。历史回执存在则返回原 ID，否则在 SQLite 事务创建会话及回执。响应丢失可用同键重试。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1000" height="400" rx="12" fill="#fff"/>
<g font-family="system-ui,sans-serif" fill="#1a1c1f"><text x="32" y="40" font-size="22" font-weight="600">会话创建：同键重试返回原身份</text>
<g fill="#f5f5f5" stroke="#d4d4d4"><rect x="30" y="100" width="210" height="110" rx="10"/><rect x="310" y="100" width="270" height="110" rx="10"/><rect x="660" y="75" width="310" height="90" rx="10"/><rect x="660" y="220" width="310" height="100" rx="10"/></g>
<g font-size="17" font-weight="600"><text x="50" y="133">桌面 / 手机创建表单</text><text x="330" y="133">Host：权限检查 → 串行门</text><text x="680" y="108">已有同键回执</text><text x="680" y="253">SQLite 单事务</text></g>
<g font-size="15"><text x="50" y="164">保留 key 与提交参数</text><text x="50" y="190">未知结果不自动重发</text><text x="330" y="164">同键不同参数：409 冲突</text><text x="330" y="190">同键同参数：查询原身份</text><text x="680" y="138">返回原 ID，保留原配置和工作区</text><text x="680" y="280">工作区 + 会话 + 事件 + 私有回执</text><text x="680" y="303">全部提交成功后返回新 ID</text></g>
<g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"><path d="M240 153H310"/><path d="M580 140H620V120H660"/><path d="M580 180H620V270H660"/><path d="M810 320V355H130V210"/></g>
<g font-size="13" fill="#525252"><text x="247" y="137">HTTP</text><text x="590" y="105">命中</text><text x="590" y="251">首次</text><text x="315" y="379">同步成功回执 { id }；响应丢失时同键重试，Host 重启后仍可对账</text></g>
</g></svg>
