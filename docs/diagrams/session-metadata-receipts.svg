<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="360" viewBox="0 0 1020 360" role="img" aria-labelledby="title desc"><title id="title">会话修改与持久回执</title><desc id="desc">桌面或手机同步提交标题或归档及稳定幂等键，Host先鉴权再在会话锁内查回执，已有回执直接返回，首次操作以事务保存视图事件回执。重试不覆盖后续修改。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#666"/></marker></defs><rect width="1020" height="360" fill="white" rx="12"/><g font-family="system-ui,sans-serif" fill="#1a1c1f"><text x="28" y="40" font-size="22" font-weight="600">重命名 / 归档：旧请求重试只对账</text><g fill="#f5f5f5" stroke="#d4d4d4"><rect x="28" y="100" width="230" height="120" rx="10"/><rect x="330" y="100" width="265" height="120" rx="10"/><rect x="670" y="76" width="320" height="80" rx="10"/><rect x="670" y="192" width="320" height="95" rx="10"/></g><g font-size="17" font-weight="600"><text x="48" y="132">桌面 / 手机会话标题栏</text><text x="350" y="132">Host：权限 → 会话串行门</text><text x="690" y="108">已有回执：返回原成功</text><text x="690" y="224">首次修改：原业务校验</text></g><g font-size="14"><text x="48" y="163">title / archived + 稳定 key</text><text x="48" y="195">失败保留身份，手动重试</text><text x="350" y="163">查回执与参数指纹</text><text x="350" y="195">同键不同参数：409</text><text x="690" y="137">不改标题 / 归档，不新增事件</text><text x="690" y="253">SQLite：视图 + 事件 + 回执</text><text x="690" y="275">事务成功后才更新内存</text></g><g fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"><path d="M258 158H330"/><path d="M595 132H631V116H670"/><path d="M595 190H631V239H670"/><path d="M830 287V320H143V220"/></g><g font-size="13" fill="#555"><text x="272" y="142">HTTP</text><text x="600" y="91">已有</text><text x="600" y="265">首次</text><text x="270" y="345">同步返回 updated；重启可对账，不自动重放会话修改。</text></g></g></svg>
