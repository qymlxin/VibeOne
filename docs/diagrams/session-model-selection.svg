<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330"><rect width="940" height="330" rx="18" fill="#181818"/><g fill="#eee" font-family="system-ui,sans-serif" font-size="16"><text x="30" y="38" font-size="21">新建会话 · 模型选择</text><g stroke="#555" fill="#272727"><rect x="30" y="65" width="245" height="215" rx="12"/><rect x="345" y="65" width="245" height="215" rx="12"/><rect x="660" y="65" width="250" height="215" rx="12"/></g><text x="50" y="99">桌面弹窗</text><text x="365" y="99">Rust Host</text><text x="680" y="99">Agent 进程</text><g fill="#bbb" font-size="14"><text x="50" y="137">读取真实模型列表</text><text x="365" y="137">本机 HTTP 请求 /models</text><text x="680" y="137">ACP 初始化 + session/new</text><text x="50" y="177">选择模型，创建会话</text><text x="365" y="177">持久保存 initialModel</text><text x="680" y="177">返回 configOptions 后关闭</text><text x="50" y="223">发送首条消息</text><text x="365" y="223">重新校验并应用模型</text><text x="680" y="223">set_config_option → prompt</text><text x="50" y="253">创建之前可取消</text><text x="365" y="253">失败则停止，不发送任务</text><text x="680" y="253">仅配置成功后开始任务</text></g></g><g fill="none" stroke="#9ab6ff" stroke-width="2"><path d="M280 137h55m-8-5 8 5-8 5M595 137h55m-8-5 8 5-8 5M280 223h55m-8-5 8 5-8 5M595 223h55m-8-5 8 5-8 5"/></g><text x="30" y="310" fill="#aaa" font-size="13" font-family="system-ui,sans-serif">列表读取不发送任务；创建只保存选择；执行前应用模型。HTTP等待结果，ACP通过JSON-RPC异步消息交换。</text></svg>
