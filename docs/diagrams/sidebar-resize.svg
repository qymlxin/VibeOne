<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc"><title id="title">连续拖动侧栏</title><desc id="desc">展开，拖入最小宽度后逐渐透明，到一半收起，不松手反向拖过一半即可恢复。</desc><rect width="900" height="220" rx="16" fill="#181818"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#242424" stroke="#494949"><rect x="24" y="55" width="230" height="90" rx="12"/><rect x="335" y="55" width="230" height="90" rx="12"/><rect x="646" y="55" width="230" height="90" rx="12"/></g><g fill="#f5f5f5" font-size="18"><text x="139" y="91">正常展开</text><text x="450" y="91">缩窄并渐隐</text><text x="761" y="91">完全收起</text></g><g fill="#b7b7b7" font-size="14"><text x="139" y="121">宽度 ≥ 最小宽度</text><text x="450" y="121">一半 &lt; 宽度 &lt; 最小宽度</text><text x="761" y="121">宽度 ≤ 最小宽度的一半</text><text x="450" y="187">保持按住反向拖动，可沿原路恢复；松手后吸附最小宽度或保持收起</text></g><path d="M267 92h52m-10-6 10 6-10 6M579 92h52m-10-6 10 6-10 6M319 115h-52m10-6-10 6 10 6M631 115h-52m10-6-10 6 10 6" fill="none" stroke="#9696ed" stroke-width="2"/></g></svg>
