<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="460" viewBox="0 0 1060 460" role="img" aria-labelledby="title desc">
<title id="title">停止请求的受理和实际结束</title><desc id="desc">客户端携带稳定key和目标Run，通过HTTP进入Host权限及串行门，重复请求返回历史受理，首次请求检查目标后同事务保存停止投影与回执，再发送停止信号，进程树排空后通过事件更新界面。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#64748b"/></marker></defs>
<rect width="1060" height="460" fill="#fff" rx="12"/>
<g font-family="system-ui,sans-serif" fill="#1a1c1f"><text x="30" y="40" font-size="22" font-weight="600">停止：保护目标执行，区分受理与结束</text>
<g fill="#f5f5f5" stroke="#d4d4d4"><rect x="30" y="100" width="210" height="100" rx="10"/><rect x="315" y="100" width="285" height="100" rx="10"/><rect x="680" y="70" width="350" height="80" rx="10"/><rect x="680" y="230" width="350" height="110" rx="10"/><rect x="315" y="300" width="285" height="100" rx="10"/></g>
<g font-size="17" font-weight="600"><text x="50" y="133">桌面 / 手机停止按钮</text><text x="335" y="133">Host：权限 → 会话串行门</text><text x="700" y="103">重复：返回原受理</text><text x="700" y="263">首次：SQLite 原子提交</text><text x="335" y="333">Host 执行驱动</text></g>
<g font-size="15"><text x="50" y="163">key + 当前活跃 runId</text><text x="50" y="187">同一Run保持相同key</text><text x="335" y="163">查回执；首次校验目标</text><text x="335" y="187">不同参数 / 过期目标：409</text><text x="700" y="130">不重投信号，不影响后续Run</text><text x="700" y="292">会话投影 + 事件 + 私有回执</text><text x="700" y="319">提交后返回 cancelRequested</text><text x="335" y="363">通知 Agent，等待进程树排空</text><text x="335" y="387">排空后才更新最终状态</text></g>
<g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"><path d="M240 150H315"/><path d="M600 125H640V110H680"/><path d="M600 175H640V280H680"/><path d="M680 320H600"/><path d="M315 355H135V200"/></g>
<g font-size="13" fill="#525252"><text x="250" y="135">HTTP</text><text x="615" y="95">命中</text><text x="610" y="252">首次</text><text x="610" y="310">信号</text><text x="37" y="329">WS / 游标同步</text><text x="315" y="435">Host重启保留受理事实，不重放停止；实际结束以会话和Run状态为准</text></g>
</g></svg>
