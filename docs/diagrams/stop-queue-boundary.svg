<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" stroke="#737d8b" fill="none"/></marker></defs><rect width="1000" height="470" fill="#fff"/>
<g font-family="system-ui,sans-serif" fill="#202327"><text x="30" y="40" font-size="21" font-weight="650">停止：在会话锁内判定最新状态</text>
<g fill="#f4f5f7" stroke="#cbd0d8"><rect x="30" y="100" width="240" height="120" rx="10"/><rect x="350" y="100" width="270" height="120" rx="10"/><rect x="710" y="100" width="260" height="120" rx="10"/><rect x="350" y="300" width="270" height="110" rx="10"/><rect x="710" y="300" width="260" height="110" rx="10"/></g>
<g font-size="16" font-weight="600"><text x="48" y="130">客户端点击停止</text><text x="368" y="130">Host 取得会话锁</text><text x="728" y="130">已排队，尚未启动</text><text x="368" y="330">已有活跃执行</text><text x="728" y="330">清理后发布终止</text></g>
<g font-size="13" fill="#4a5565"><text x="48" y="158">HTTP POST /sessions/:id/cancel</text><text x="48" y="182">不把客户端显示当作执行事实</text><text x="368" y="158">检查当前活跃状态和队列</text><text x="368" y="182">与 driver 启动相互串行</text><text x="728" y="158">持久暂停队列，保留消息</text><text x="728" y="182">释放预留工作区租约</text><text x="728" y="206">后续由用户明确恢复</text><text x="368" y="357">取消当前执行并暂停后续队列</text><text x="368" y="381">清理前继续持有工作区租约</text><text x="728" y="357">ACP取消、连接关闭、进程排空</text><text x="728" y="381">再发布停止状态并释放租约</text></g>
<g stroke="#8e98a7" stroke-width="1.5" fill="none" marker-end="url(#arrow)"><path d="M270 160H346"/><path d="M620 160H706"/><path d="M485 220V296"/><path d="M620 357H706"/></g><g font-size="12"><text x="291" y="145">请求</text><text x="636" y="145">无活跃</text><text x="496" y="263">有活跃</text><text x="637" y="342">异步清理</text></g>
<text x="30" y="447" font-size="13" fill="#4a5565">无活跃执行时，手动暂停或撤空队列也释放预留租约；运行中的队列暂停不会提前释放。</text></g></svg>
