<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs><rect width="1040" height="480" rx="16" fill="#f8fafc"/><g font-family="system-ui,sans-serif" fill="#172033"><text x="32" y="42" font-size="22" font-weight="650">独立插件 · 统一安装与加载</text><g fill="white" stroke="#cbd5e1"><rect x="32" y="82" width="240" height="126" rx="10"/><rect x="360" y="82" width="300" height="126" rx="10"/><rect x="744" y="82" width="264" height="126" rx="10"/><rect x="360" y="284" width="300" height="150" rx="10"/></g><g font-size="16"><text x="50" y="112" font-weight="650">GitHub / 本地插件目录</text><text x="50" y="145">files · changes</text><text x="50" y="173">terminal · browser · 第三方包</text><text x="378" y="112" font-weight="650">Rust Host · 生命周期</text><text x="378" y="145">检查 → 授权 → 复制 → prepare</text><text x="378" y="173">commit / discard · 安装副本持久化</text><text x="762" y="112" font-weight="650">React · AppRuntime</text><text x="762" y="145">准备 → 发布代次 → 注册面板</text><text x="762" y="173">更新失败保留旧版</text><text x="378" y="315" font-weight="650">受支持的 SDK 服务</text><text x="378" y="347">HTTP/JSON：授权文件 / Git / 产物</text><text x="378" y="378">异步 IPC：PTY / Chromium</text><text x="378" y="409">停用：撤下注册、关闭所属资源</text></g><g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"><path d="M272 146H350"/><path d="M660 146H734"/><path d="M876 208V360H670"/></g><g font-size="12" fill="#526174"><text x="278" y="130">下载 / 选择</text><text x="676" y="130">异步请求</text><text x="778" y="343">加载后按需调用</text><text x="32" y="460">插件更新无需重建桌面；增加宿主原生能力时仍需升级桌面。</text></g></g></svg>
