<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440"><rect width="900" height="440" rx="12" fill="#fafafa"/><style>text{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#222}.sub{font-size:12px;fill:#666}.box{fill:#fff;stroke:#d6d6d6}.arrow{fill:none;stroke:#777;stroke-width:1.4;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#777"/></marker></defs><text x="28" y="34" font-weight="600">工作区工具：App插件负责界面，核心服务持有执行与授权</text><rect class="box" x="28" y="65" width="228" height="88" rx="8"/><text x="44" y="92">内置App插件</text><text class="sub" x="44" y="117">文件 / 变更 / 终端 / 网页</text><text class="sub" x="44" y="137">设置开关 · 本设备持久化</text><rect class="box" x="28" y="173" width="228" height="88" rx="8"/><text x="44" y="200">已安装App插件</text><text class="sub" x="44" y="225">app.panel + workspace.tool</text><text class="sub" x="44" y="245">Host管理包版本、授权与停用</text><path class="arrow" d="M256 109H302V148H338"/><path class="arrow" d="M256 216H302V190H338"/><rect class="box" x="342" y="118" width="224" height="104" rx="8"/><text x="358" y="146">AppRuntime → 工具注册表</text><text class="sub" x="358" y="172">准备候选 → 发布组件</text><text class="sub" x="358" y="194">停用 → 撤下注册 → 卸载资源</text><path class="arrow" d="M566 169H622"/><rect class="box" x="626" y="118" width="246" height="104" rx="8"/><text x="642" y="146">工作台工具入口与标签页</text><text class="sub" x="642" y="172">按注册表展示功能与面板</text><text class="sub" x="642" y="194">错误隔离 · 拖动布局 · 开关状态</text><path class="arrow" d="M748 222V292"/><rect class="box" x="470" y="297" width="402" height="108" rx="8"/><text x="486" y="325">核心能力服务</text><text class="sub" x="486" y="351">Rust Host：HTTP/JSON + WebSocket事件</text><text class="sub" x="486" y="373">Electron：异步IPC → PTY / 独立网页视图</text><text class="sub" x="486" y="393">文件授权、执行、审批与会话历史保持独立</text><rect class="box" x="28" y="297" width="364" height="108" rx="8"/><text x="44" y="325">第三方后台逻辑</text><text class="sub" x="44" y="351">App SDK → Host插件操作接口</text><text class="sub" x="44" y="373">Host → Node Worker：stdio JSON-RPC</text><text class="sub" x="44" y="393">进度与结果沿原链路返回，不新增旁路权限</text><path class="arrow" d="M470 351H396"/></svg>
